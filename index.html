<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法風雲會 - 決戰計血器</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(15, 12, 25, 0.4);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8a6d1b;
            --crimson: #a91b1b;
            --crimson-glow: #ff4d4d;
            --border-style: 1px solid var(--gold-primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background: #0d0b14 url('https://cdn.cardsrealm.com/images/cartas/atdm-tarkir-dragonstom-art-series/EN/med/elspeth-storm-slayer-art-series-49.png?3317') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .overlay {
            background: var(--bg-overlay);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 8, 15, 0.9);
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .magic-menu-toggle {
            background: radial-gradient(circle, rgba(30, 20, 50, 0.9) 0%, rgba(10, 8, 20, 0.95) 100%);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4), inset 0 0 8px rgba(138, 43, 226, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .magic-menu-toggle:hover {
            border-color: var(--gold-light);
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.8), 0 0 25px rgba(138, 43, 226, 0.6), inset 0 0 10px rgba(243, 229, 171, 0.5);
            transform: scale(1.05);
        }

        .menu-line {
            display: block;
            width: 22px;
            height: 2px;
            background: linear-gradient(90deg, var(--gold-light), var(--gold-primary));
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(243, 229, 171, 0.8);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, background 0.3s ease;
        }

        .magic-menu-toggle::before,
        .magic-menu-toggle::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px var(--gold-primary);
            pointer-events: none;
            animation: menuSparkle 2s infinite ease-in-out;
        }
        .magic-menu-toggle::before { top: -4px; right: -4px; animation-delay: 0s; }
        .magic-menu-toggle::after { bottom: -4px; left: -4px; animation-delay: 1s; }

        @keyframes menuSparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .magic-menu-toggle.active {
            background: radial-gradient(circle, rgba(50, 20, 30, 0.9) 0%, rgba(20, 8, 15, 0.95) 100%);
            border-color: var(--crimson-glow);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6), inset 0 0 10px rgba(169, 27, 27, 0.5);
        }

        .magic-menu-toggle.active .menu-line {
            background: linear-gradient(90deg, #ffffff, var(--crimson-glow));
            box-shadow: 0 0 8px var(--crimson-glow);
        }

        .magic-menu-toggle.active .menu-line:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .magic-menu-toggle.active .menu-line:nth-child(2) {
            opacity: 0;
            transform: scale(0);
        }
        .magic-menu-toggle.active .menu-line:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 8, 15, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 499;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: -68%;
            width: 68%;
            max-width: 320px;
            height: 100%;
            background: rgba(16, 13, 24, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: none; 
            box-shadow: -15px 0 40px rgba(0, 0, 0, 0.85);
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 500;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-drawer.active { right: 0; }

        .menu-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0 20px 16px 20px;
            color: var(--gold-primary);
        }

        .menu-item {
            padding: 16px 24px;
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            color: #bfa87a;
            text-align: left;
            cursor: pointer;
            border-radius: 0;
            font-size: 1.1rem;
            font-family: 'Noto Serif TC', serif;
            transition: all 0.2s ease;
        }

        .menu-item:hover { 
            background: rgba(212, 175, 55, 0.08); 
            color: var(--gold-light);
        }

        .menu-item.active {
            background: rgba(212, 175, 55, 0.15);
            border-left: 3px solid var(--gold-primary);
            color: #fff;
            font-weight: bold;
        }

        .btn-magic {
            background: linear-gradient(180deg, var(--gold-primary), var(--gold-dark));
            color: #0f0c19;
            border: 1px solid var(--gold-light);
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        .btn-magic:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .btn-subtle-link {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--gold-primary);
            color: var(--gold-light) !important;
            padding: 4px 2px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            transition: border-color 0.2s ease, text-shadow 0.2s ease;
            box-shadow: none;
            border-radius: 0;
        }
        .btn-subtle-link:hover {
            color: var(--gold-light) !important;
            border-bottom-color: var(--gold-light);
            text-shadow: none;
        }
        .btn-subtle-link:active {
            transform: none;
            background: transparent;
            color: var(--gold-light) !important;
        }

        .btn-round-home {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, #382852 0%, #150c24 100%);
            border: 2px solid var(--gold-primary);
            color: var(--gold-light);
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35), inset 0 0 20px rgba(138, 43, 226, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-round-home::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-round-home:hover {
            transform: scale(1.08);
            border-color: var(--gold-light);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.6), 0 0 20px rgba(138, 43, 226, 0.5), inset 0 0 15px rgba(243, 229, 171, 0.4);
            color: #fff;
        }

        .btn-round-home:hover::before {
            opacity: 1;
        }

        .btn-round-home:active {
            transform: scale(0.95);
        }

        .view {
            display: none;
            flex: 1;
            padding: 10px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #home-view { gap: 25px; }

        .home-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold-primary);
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            margin-bottom: 10px;
        }

        #game-view {
            padding: 15px 10px 80px 10px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            border-radius: 0;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: none;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 30%, rgba(138, 27, 27, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(75, 18, 110, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(20, 10, 35, 0.6) 0%, transparent 60%),
                linear-gradient(180deg, #07050a 0%, #150a18 50%, #08030b 100%);
        }

        .ember-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffaa33, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 150px, #ff4400, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 80px, #ffdd66, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 400px 220px, #ff3300, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 900px 400px;
            animation: embersMove 12s linear infinite, pulseGlow 4s ease-in-out infinite alternate;
            opacity: 0.7;
        }

        @keyframes embersMove {
            0% { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
            100% { background-position: -100px -400px, 100px -400px, -50px -400px, 80px -400px; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .game-grid.layout-large { grid-template-columns: 1fr; }

        .player-card-wrapper {
            perspective: 1000px;
            -webkit-perspective: 1000px;
            min-height: 205px;
            height: 100%;
            will-change: transform;
            position: relative;
        }

        .player-card {
            width: 100%; 
            height: 100%;
            min-height: 205px;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .player-card.flipped { 
            transform: rotateY(180deg); 
            -webkit-transform: rotateY(180deg); 
        }

        .card-front, .card-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            border: 1px solid var(--gold-primary) !important;
            outline: 1px solid rgba(212, 175, 55, 0.25);
            outline-offset: -4px;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 -40px 60px rgba(0, 0, 0, 0.85), 0 10px 30px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
            transition: filter 0.3s ease;
        }

        .card-front {
            z-index: 2;
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);
        }

        .card-back {
            z-index: 1;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            padding: 8px 10px;
        }

        .card-front::before, .card-back::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(15, 12, 25, 0.4) 0%, rgba(10, 8, 15, 0.85) 100%);
            z-index: 1;
        }

        .card-front > *, .card-back > * {
            position: relative;
            z-index: 2;
        }

        .player-card.immunity-active .card-front,
        .player-card.immunity-active .card-back {
            border-color: #ffd700 !important;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.6) !important;
        }

        .icon-btn-immunity {
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.35;
            filter: grayscale(1);
            transition: all 0.2s ease;
            line-height: 1;
        }

        .icon-btn-immunity.active {
            opacity: 1;
            filter: drop-shadow(0 0 8px #ffd700);
            transform: scale(1.1);
        }

        .action-icon-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 2px;
        }

        .player-card.eliminated .card-front,
        .player-card.eliminated .card-back {
            filter: grayscale(100%) brightness(0.22);
        }

        .skull-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .player-card.eliminated .skull-overlay {
            display: flex;
        }

        .skull-svg {
            width: 160px;
            height: 160px;
            animation: magicSummon 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 15px #ff1a1a) drop-shadow(0 0 30px #800000);
        }

        @keyframes magicSummon {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(12px); }
            60% { transform: scale(1.08) rotate(5deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        }

        .skull-eye-fire {
            animation: eyePulsate 1.2s ease-in-out infinite alternate;
        }

        @keyframes eyePulsate {
            0% { opacity: 0.5; transform: scale(0.85); filter: drop-shadow(0 0 4px #ff0000); }
            100% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 12px #ff4d4d) drop-shadow(0 0 20px #ff0000); }
        }

        .card-back-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            gap: 4px;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            cursor: pointer;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .monarch-crown {
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.2s;
            line-height: 1;
        }

        .monarch-crown.active {
            opacity: 1;
            filter: drop-shadow(0 0 6px #ffd700);
        }

        .life-display {
            font-size: 2.8rem;
            font-weight: 900;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            text-shadow: 0 3px 6px rgba(0, 0, 0, 1), 0 0 15px rgba(212, 175, 55, 0.6);
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.15s ease;
        }

        .life-display.danger {
            color: var(--crimson-glow);
            text-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
        }

        .life-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-life {
            flex: 1;
            padding: 4px 0;
            font-size: 1rem;
            font-weight: bold;
            background: rgba(20, 15, 30, 0.45) !important;
            border: 1px solid rgba(212, 175, 55, 0.25) !important;
            color: rgba(243, 229, 171, 0.85);
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(2px);
            box-shadow: none !important;
            font-family: 'Noto Serif TC', serif;
            transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .btn-life-large {
            padding: 7px 0;
            font-size: 1.3rem;
        }

        .btn-status-ctrl {
            padding: 3px 0;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .btn-life:active {
            transform: scale(0.93) !important;
            background: rgba(212, 175, 55, 0.25) !important;
            border-color: var(--gold-primary) !important;
            color: #fff !important;
        }

        .status-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .status-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badges {
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
            justify-content: center;
            cursor: pointer;
            min-height: 16px;
        }

        .badge {
            background: rgba(42, 31, 61, 0.85);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
        }

        .badge.warning-glow {
            background: rgba(90, 0, 0, 0.85);
            border-color: #ff4d4d;
            color: #ff9999;
            box-shadow: 0 0 8px #ff0000;
        }

        .btn-flip-back {
            background: none !important;
            border: none !important;
            color: var(--gold-primary);
            padding: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: none !important;
        }

        .btn-flip-back:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .btn-flip-back svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.5));
        }

        .floating-controls {
            position: fixed;
            bottom: 20px; right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn-icon-styled {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a2b54, #0d0814) !important;
            border: 1.5px solid var(--gold-primary) !important;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9), 0 0 12px rgba(212, 175, 55, 0.3) !important;
            transition: all 0.2s ease;
        }

        .btn-icon-styled:active {
            transform: scale(0.9);
        }

        .btn-icon-styled svg { width: 24px; height: 24px; fill: currentColor; }

        .modal-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-mask.active { display: flex; }

        .modal-content {
            background: rgba(24, 20, 36, 0.95);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 20px;
            width: 95%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.25);
            font-family: 'Noto Serif TC', serif;
        }

        .modal-close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            color: var(--gold-primary);
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {

    let state = {
        historyNames: JSON.parse(localStorage.getItem('mtg_historyNames')) || {},

    let activeSelectingPlayerIndex = null;

    function bindHoldEvent(element, actionFn) {
        if (!element) return;
        let holdTimer = null;
        let holdInterval = null;
        let activePointerId = null;

        const stop = (e) => {
            if (activePointerId !== null && element.releasePointerCapture) {
                try { element.releasePointerCapture(activePointerId); } catch(err){}
                activePointerId = null;
            }
            if (holdTimer) clearTimeout(holdTimer);
            if (holdInterval) clearInterval(holdInterval);

        const start = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            stop();

            activePointerId = e.pointerId;
            if (element.setPointerCapture) {
                try { element.setPointerCapture(e.pointerId); } catch(err){}
            }

            actionFn();

            holdTimer = setTimeout(() => {
                let speed = 150;
                const runStep = () => {
                    actionFn();
                    speed = Math.max(60, speed * 0.9);
                    holdInterval = setTimeout(runStep, speed);
                };
                runStep();
            }, 350);
        };

        element.addEventListener('pointerdown', start);
        element.addEventListener('pointerup', stop);
        element.addEventListener('pointercancel', stop);
        element.addEventListener('pointerleave', stop);
    }

            document.getElementById('btn-continue').style.display = 'flex';

    function updateSetupForm() {
        const mode = document.getElementById('modeSelect').value;
        const countSelect = document.getElementById('playerCountSelect');
        const currentCount = countSelect.value;
        countSelect.innerHTML = '';

        if (mode === 'TwoHeadedGiant') {
            [4, 6, 8].forEach(n => countSelect.add(new Option(`${n} 人 (${n/2} 隊)`, n)));
        } else {
            for(let i=2; i<=8; i++) countSelect.add(new Option(`${i} 人`, i));
        }

        if (Array.from(countSelect.options).some(opt => opt.value === currentCount)) {
            countSelect.value = currentCount;
        }

    function updatePlayerRows() {
        const mode = document.getElementById('modeSelect').value;
        const count = parseInt(document.getElementById('playerCountSelect').value);
        const container = document.getElementById('playerSetupList');

        const oldInputs = Array.from(container.querySelectorAll('.p-name')).map(i => i.value);
        const oldAvatars = Array.from(container.querySelectorAll('.avatar-preview')).map(img => img.src);

        container.innerHTML = '';
        let rowCount = mode === 'TwoHeadedGiant' ? count / 2 : count;

            row.className = 'player-setup-row';

                let name2 = oldInputs[i * 2 + 1] || '';

                    <span class="team-label">${i+1}</span>
                    <input type="text" placeholder="隊友 1" class="p-name" value="${name1}" oninput="validateSetupForm()">
                    <input type="text" placeholder="隊友 2" class="p-name" value="${name2}" oninput="validateSetupForm()">

    function startGame() {
        openedFromNextStepModal = false;
        const mode = document.getElementById('modeSelect').value;
        const rows = document.querySelectorAll('.player-setup-row');
        let players = [];
        let defaultLife = mode === 'TwoHeadedGiant' ? 50 : 40;

        rows.forEach((row, idx) => {
            if (mode === 'TwoHeadedGiant') {
                const names = Array.from(row.querySelectorAll('.p-name')).map(i => i.value.trim());
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: `${names[0]} & ${names[1]}`,
                    members: [names[0], names[1]],
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
            } else {
                const name = row.querySelector('.p-name').value.trim();
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: name,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
                state.historyNames[name] = avatar;
            }
        });

        localStorage.setItem('mtg_historyNames', JSON.stringify(state.historyNames));
        state.currentGame = { mode: mode, players: players };

        saveCurrentGame();
        closeModal('newGameModal');
        navTo('game-view');

    function checkEliminated(p) {
        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(d => { if (d > maxCmdDmg) maxCmdDmg = d; });
        }
        const conditionMet = (p.life <= 0 || p.poison >= 10 || maxCmdDmg >= 21);
        return conditionMet && !p.isImmune;
    }

    function toggleImmunity(index) {

    function updateCardBadgesUI(index) {
        const p = state.currentGame.players[index];
        const badgesContainer = document.getElementById(`status-badges-${index}`);
        const cmdBtn = document.getElementById(`cmd-btn-${index}`);
        const cardElem = document.getElementById(`card-${index}`);

        if (!badgesContainer) return;

        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(dmg => {
                if (dmg > maxCmdDmg) maxCmdDmg = dmg;
            });
        }

        badgesContainer.innerHTML = `
            ${p.poison > 0 ? `<span class="badge ${p.poison >= 8 ? 'warning-glow' : ''}">🧪 ${p.poison}</span>` : ''}
            ${maxCmdDmg > 0 ? `
                <span class="badge ${maxCmdDmg >= 15 ? 'warning-glow' : ''}" onclick="event.stopPropagation(); openCmdDamageModal(${index})">
                    ⚔️ ${maxCmdDmg}
                </span>
            ` : ''}
        `;

        if (cmdBtn) {
            cmdBtn.innerText = `傷害列表 (最高: ${maxCmdDmg})`;
        }

        let p = state.currentGame.players[index];
        p.life += delta;

        const lifeDisplay = document.getElementById(`life-val-${index}`);
        if (lifeDisplay) {
            lifeDisplay.innerText = p.life;

        updateCardBadgesUI(index);

        listContainer.innerHTML = '';

        if (!victim.cmdDamages) victim.cmdDamages = {};

        state.currentGame.players.forEach((attacker, attackerIdx) => {
            if (attackerIdx === victimIndex) return;

            let attackerList = [];
            if (is2HG && attacker.members && attacker.members.length > 0) {
                attackerList = attacker.members.map(m => ({ name: m, avatar: attacker.avatar }));
            } else {
                attackerList = [{ name: attacker.name, avatar: attacker.avatar }];
            }

            attackerList.forEach(atk => {
                const currentDmg = victim.cmdDamages[atk.name] || 0;

    function changeCmdDamageDetail(victimIndex, attackerName, delta) {
        const victim = state.currentGame.players[victimIndex];
        if (!victim.cmdDamages) victim.cmdDamages = {};
        
        let current = victim.cmdDamages[attackerName] || 0;
        let updated = Math.max(0, current + delta);
        victim.cmdDamages[attackerName] = updated;

        saveCurrentGame();
        
        const valElem = document.getElementById(`cmd-val-${victimIndex}-${attackerName}`);
        if (valElem) {
            valElem.innerText = `${updated} / 21`;
            valElem.style.color = updated >= 15 ? 'var(--crimson-glow)' : 'var(--gold-primary)';
        }

        updateCardBadgesUI(victimIndex);
    }

                p.isMonarch = !p.isMonarch;
                p.life = p.isMonarch ? 50 : 40;
            } else {

            }
        });

    function rollD20All() {
        if (!state.currentGame || !state.currentGame.players) return;
        
        const results = document.getElementById('diceResults');
        const titleElem = document.getElementById('diceWinnerTitle');
        const closeBtn = document.getElementById('btnDiceClose');

        titleElem.innerHTML = `🎲 擲骰進行中...`;
        closeBtn.style.display = 'none';
        document.getElementById('diceModal').classList.add('active');

        let contenders = state.currentGame.players.map(p => ({ name: p.name }));
        let roundLogs = [];
        let round = 1;
        let finalWinner = "";

        while (contenders.length > 1) {
            let log = { round: round, rolls: [], isTie: false };
            let maxRoll = -1;
            let currentWinners = [];

            contenders.forEach(c => {
                const roll = Math.floor(Math.random() * 20) + 1;
                log.rolls.push({ name: c.name, roll: roll });
                if (roll > maxRoll) {
                    maxRoll = roll;
                    currentWinners = [{ name: c.name, roll: roll }];
                } else if (roll === maxRoll) {
                    currentWinners.push({ name: c.name, roll: roll });
                }
            });

            if (currentWinners.length === 1) {
                finalWinner = currentWinners[0].name;
                roundLogs.push(log);
                break;
            } else {
                log.isTie = true;
                roundLogs.push(log);
                contenders = currentWinners;
                round++;
            }
        }

        let startTime = Date.now();
        let animInterval = setInterval(() => {
            let elapsedTime = Date.now() - startTime;
            if (elapsedTime < 1000) {
                let randomRolls = state.currentGame.players.map(p => 
                    `<div><strong>${p.name}</strong> 🎲 <span class="dice-rolling">${Math.floor(Math.random() * 20) + 1}</span></div>`
                ).join('');
                results.innerHTML = `<div style="text-align:center;">${randomRolls}</div>`;
            } else {
                clearInterval(animInterval);
                titleElem.innerHTML = `由 <span style="color:#ffd700">${finalWinner}</span> 開始遊戲`;
                closeBtn.style.display = 'block';

                let finalHtml = '';
                roundLogs.forEach(log => {
                    if (log.round > 1) {
                        finalHtml += `<div style="color:var(--gold-primary); margin-top:8px; font-weight:bold; border-top:1px dashed #444; padding-top:4px;">⚠️ 出現最高平手！進行第 ${log.round} 輪同分重擲：</div>`;
                    }
                    log.rolls.forEach(r => {
                        finalHtml += `<div><strong>${r.name}</strong> 擲出 🎲 <span style="color:var(--gold-primary); font-size:1.2rem; font-weight:bold;">${r.roll}</span> 點</div>`;
                    });
                });
                results.innerHTML = finalHtml;
            }
        }, 80);
    }

        if (state.currentGame && state.currentGame.players && state.currentGame.players.length > 0) {
            state.currentGame.players.forEach((p, idx) => {
                const lifeColorStyle = p.life <= 0 ? 'color: var(--crimson-glow); font-weight: bold;' : '';
                list.innerHTML += `
                    <label class="winner-checkbox-item" id="winner-row-${idx}">
                        <input type="checkbox" class="winner-checkbox" value="${idx}" onchange="onWinnerCheckChange(this, ${idx})">

        const row = document.getElementById(`winner-row-${idx}`);

    function validateWinnerSelection() {
        const checkedCount = document.querySelectorAll('.winner-checkbox:checked').length;
        const btn = document.getElementById('btnConfirmWinner');

            btn.disabled = (checkedCount === 0);

    function submitWinnerAndNext() {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        let winnersIndices = [];
        checkboxes.forEach(cb => {
            if (cb.checked) winnersIndices.push(parseInt(cb.value));
        });

        if (state.currentGame && state.currentGame.players) {
            recordGameResult(winnersIndices);
        }

        closeModal('resetModal');
        document.getElementById('nextStepModal').classList.add('active');
    }

    function handleNextStep(action) {
        closeModal('nextStepModal');

        if (action === 'same' && state.currentGame && state.currentGame.players) {
            let defaultLife = state.currentGame.mode === 'TwoHeadedGiant' ? 50 : 40;
            state.currentGame.players.forEach(p => {
                p.life = p.isMonarch ? 50 : defaultLife;
                p.poison = 0;
                p.cmdDamages = {};
                p.isImmune = false;
            });
            saveCurrentGame();
            renderGameGrid();
        } else if (action === 'new') {
            openedFromNextStepModal = true;
            openNewGameModal();
        } else if (action === 'leave') {
            state.currentGame = null;
            localStorage.removeItem('mtg_currentGame');
            document.getElementById('btn-continue').style.display = 'none';
            navTo('home-view');
        }
    }

    function recordGameResult(winnersIndices) {
        if (!state.currentGame || !state.currentGame.players) return;

        let dateStr = new Date().toLocaleDateString();
        let modeName = state.currentGame.mode === 'TwoHeadedGiant' ? '雙頭巨人' : (state.currentGame.mode === 'Kingdoms' ? '三國殺' : '指揮官');

        let lastRecordGroup = state.records.length > 0 ? state.records[state.records.length - 1] : null;
        if (!lastRecordGroup || lastRecordGroup.date !== dateStr) {
            state.gameCount = 1;
        }

        let playersSnapshot = state.currentGame.players.map(p => ({
            name: p.name,
            members: p.members || null,
            life: p.life,
            isWinner: winnersIndices.includes(p.id)
        }));

        let winnersNames = playersSnapshot.filter(p => p.isWinner).map(p => p.name);

        state.records.push({
            date: dateStr,
            gameIndex: state.gameCount,
            mode: modeName,
            winners: winnersNames,
            players: playersSnapshot
        });

        state.gameCount++;
        localStorage.setItem('mtg_records', JSON.stringify(state.records));
        localStorage.setItem('mtg_gameCount', state.gameCount);
        updateRecordsTable();
    }

    function toggleRowDetail(rowId) {
        const detailRow = document.getElementById(rowId);
        if (detailRow) {
            detailRow.style.display = detailRow.style.display === 'none' ? 'table-row' : 'none';
        }
    }

    function updateRecordsTable() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        let formattedRecords = state.records.map(r => {
            if (r.players && Array.isArray(r.players)) return r;
            return {
                date: r.date,
                gameIndex: r.gameIndex || 1,
                mode: '指揮官',
                winners: r.result === 'WIN' ? [r.name] : [],
                players: [{ name: r.name, isWinner: r.result === 'WIN', life: '-' }]
            };
        });

        formattedRecords.sort((a, b) => {
            let dateA = new Date(a.date).getTime();
            let dateB = new Date(b.date).getTime();
            
            if (dateA === dateB) {
                return (b.gameIndex || 1) - (a.gameIndex || 1);
            }
            return dateB - dateA;
        });

        formattedRecords.forEach((r, idx) => {
            const detailRowId = `history-detail-${idx}`;
            const winnersText = r.winners.length > 0 ? `<span class="win-tag">${r.winners.join(', ')}</span>` : '<span style="color:#aaa;">無贏家記錄</span>';

            tbody.innerHTML += `
                <tr class="history-main-row" onclick="toggleRowDetail('${detailRowId}')">
                    <td>${r.date}</td>
                    <td>第 ${r.gameIndex} 局</td>
                    <td>${r.mode || '指揮官'}</td>
                    <td>${winnersText}</td>
                </tr>
                <tr id="${detailRowId}" class="history-detail-row">
                    <td colspan="4">
                        <div class="history-detail-content">
                            <strong>📊 本局參與玩家與血量結算：</strong><br>
                            ${r.players.map(p => `• ${p.name}：${p.isWinner ? '<strong style="color:#ffd700;">[獲勝]</strong>' : '落敗'} (最終血量: ${p.life})`).join('<br>')}
                        </div>
                    </td>
                </tr>
            `;
        });

        const statsMap = {};

        formattedRecords.forEach((r, recordIndex) => {
            r.players.forEach(p => {
                let individuals = [];
                if (r.mode === '雙頭巨人' || (p.members && p.members.length > 0)) {
                    if (p.members && p.members.length > 0) {
                        individuals = p.members;
                    } else if (p.name.includes(' & ')) {
                        individuals = p.name.split(' & ').map(m => m.trim());
                    } else {
                        individuals = [p.name];
                    }
                } else {
                    individuals = [p.name];
                }

                individuals.forEach(indName => {
                    if (!statsMap[indName]) {
                        statsMap[indName] = { name: indName, win: 0, lose: 0, firstIndex: recordIndex };
                    }
                    if (p.isWinner) statsMap[indName].win++;
                    else statsMap[indName].lose++;
                });
            });
        });

        const statsArray = Object.values(statsMap).map(s => {
            const total = s.win + s.lose;
            const rate = total > 0 ? Math.round((s.win / total) * 100) : 0;
            return { ...s, total, rate };
        });

        statsArray.sort((a, b) => b.rate - a.rate || b.win - a.win);

        const summaryElem = document.getElementById('statsSummaryContent');
        if (statsArray.length === 0) {
            summaryElem.innerHTML = `<div style="color:#aaa;">尚無統計數據</div>`;
        } else {
            summaryElem.innerHTML = statsArray.map(s => `
                <div class="stats-item">
                    <div class="stats-info-row">
                        <span><strong>${s.name}</strong></span>
                        <span style="font-size: 0.85rem; color: var(--gold-light);">${s.win}勝 / ${s.lose}敗 (勝率: ${s.rate}%)</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${s.rate}%;"></div>
                    </div>
                </div>
            `).join('');
        }
    }

    function exportRecords() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.records, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mtg_records_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
    }

    function importRecords(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    let addedCount = 0;
                    importedData.forEach(importedRec => {
                        const isDuplicate = state.records.some(existingRec => 
                            existingRec.date === importedRec.date &&
                            existingRec.gameIndex === importedRec.gameIndex &&
                            JSON.stringify(existingRec.winners) === JSON.stringify(importedRec.winners)
                        );

                        if (!isDuplicate) {
                            state.records.push(importedRec);
                            addedCount++;
                        }
                    });

                    state.records.sort((a, b) => a.gameIndex - b.gameIndex);

                    const maxGameIdx = state.records.reduce((max, r) => Math.max(max, r.gameIndex || 0), 0);
                    if (maxGameIdx >= state.gameCount) {
                        state.gameCount = maxGameIdx + 1;
                        localStorage.setItem('mtg_gameCount', state.gameCount);
                    }

                    localStorage.setItem('mtg_records', JSON.stringify(state.records));
                    updateRecordsTable();
                    alert(`對戰紀錄匯入成功！共新增 ${addedCount} 筆對戰歷史。`);
                }
            } catch (err) {
                alert("檔案格式錯誤，匯入失敗。");
            }
            event.target.value = '';
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
