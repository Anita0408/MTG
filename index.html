<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG 魔法風雲會計血器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e24;
            --card-border: #33333d;
            --primary-text: #ffffff;
            --secondary-text: #a0a0b0;
            --danger-color: #ff4d4d;
            --poison-color: #4dff88;
            --immunity-color: #ffd700;
            --immunity-glow: rgba(255, 215, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #e0e0e0;
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* 卡牌基礎樣式 */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            height: 380px;
            position: relative;
            perspective: 1000px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--card-bg);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* 卡牌頭部區域 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
            word-break: break-word;
            max-width: 60%;
        }

        .card-controls {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: #2a2a35;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: #3a3a48;
        }

        /* 不死模式防護光暈與標籤 */
        .immunity-btn {
            background: #2a2a15;
            border-color: #665500;
            color: #ccc;
        }

        .card.immunity-active {
            border-color: var(--immunity-color);
            box-shadow: 0 0 15px var(--immunity-glow);
        }

        .card.immunity-active .immunity-btn {
            background: var(--immunity-color);
            color: #000;
            font-weight: bold;
        }

        /* 淘汰機制：反灰與 SVG 骷髏頭印章 */
        .card.eliminated {
            filter: grayscale(100%) brightness(0.4);
            pointer-events: none; /* 鎖定大部分互動，仍保留關閉淘汰按鈕功能 */
        }

        .card.eliminated .card-controls {
            pointer-events: auto; /* 允許點擊復原或開啟不死 */
        }

        .skull-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .card.eliminated .skull-overlay {
            display: flex;
        }

        .skull-svg {
            width: 120px;
            height: 120px;
            fill: #d0d0d0;
            filter: drop-shadow(0px 0px 8px rgba(0,0,0,0.9));
            opacity: 0.85;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 0.85; }
        }

        /* 生命值主顯示區 */
        .life-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }

        .life-value {
            font-size: 4rem;
            font-weight: 800;
            text-align: center;
            flex-grow: 1;
        }

        .life-value.negative {
            color: var(--danger-color);
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .btn-adjust {
            background: #2a2a35;
            border: 1px solid #444;
            color: white;
            font-size: 1.8rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s;
        }

        .btn-adjust:active {
            transform: scale(0.92);
            background: #4a4a5a;
        }

        /* 資訊摘要與狀態顯示 */
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #141418;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--secondary-text);
        }

        .status-item span {
            color: #fff;
            font-weight: bold;
        }

        /* 背面：詳細數據調整 */
        .back-section {
            margin-bottom: 15px;
        }

        .back-title {
            font-size: 0.9rem;
            color: var(--secondary-text);
            margin-bottom: 6px;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141418;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .counter-btn {
            background: #333;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>MTG Life Tracker</h1>
    </header>

    <div class="grid-container" id="playersContainer">
        <!-- 卡牌將由 JavaScript 動態生成 -->
    </div>

    <script>
        // 初始化玩家資料（支援 4 人對局）
        const players = [
            { id: 1, name: "玩家 1", life: 40, poison: 0, cmdDamage: 0, immunity: false },
            { id: 2, name: "玩家 2", life: 40, poison: 0, cmdDamage: 0, immunity: false },
            { id: 3, name: "玩家 3", life: 40, poison: 0, cmdDamage: 0, immunity: false },
            { id: 4, name: "玩家 4", life: 40, poison: 0, cmdDamage: 0, immunity: false }
        ];

        // 高解析金屬風格向量骷髏頭 SVG
        const skullSVG = `
            <svg class="skull-svg" viewBox="0 0 24 24">
                <path d="M12,2C6.47,2 2,6.47 2,12C2,15.22 3.53,18.09 5.9,19.92C6.18,20.14 6.53,20.25 6.88,20.25H8V22H16V20.25H17.12C17.47,20.25 17.82,20.14 18.1,19.92C20.47,18.09 22,15.22 22,12C22,6.47 17.53,2 12,2ZM9,9A1.5,1.5 0 0,1 10.5,10.5A1.5,1.5 0 0,1 9,12A1.5,1.5 0 0,1 7.5,10.5A1.5,1.5 0 0,1 9,9ZM15,9A1.5,1.5 0 0,1 16.5,10.5A1.5,1.5 0 0,1 15,12A1.5,1.5 0 0,1 13.5,10.5A1.5,1.5 0 0,1 15,9ZM8.5,15.5H15.5V17H8.5V15.5Z"/>
            </svg>
        `;

        function renderCards() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';

            players.forEach(p => {
                // 判斷淘汰條件：(血量 <= 0 或 中毒 >= 10) 且 未開啟不死之身
                const isEliminated = (p.life <= 0 || p.poison >= 10 || p.cmdDamage >= 21) && !p.immunity;

                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${isEliminated ? 'eliminated' : ''} ${p.immunity ? 'immunity-active' : ''}`;
                cardDiv.id = `card-${p.id}`;

                cardDiv.innerHTML = `
                    <div class="skull-overlay">${skullSVG}</div>
                    <div class="card-inner">
                        <!-- 卡牌正面 -->
                        <div class="card-front">
                            <div class="card-header">
                                <div class="player-name">${p.name}</div>
                                <div class="card-controls">
                                    <button class="btn-icon immunity-btn" onclick="toggleImmunity(${p.id})">
                                        🛡️ ${p.immunity ? '不死中' : '不死'}
                                    </button>
                                    <button class="btn-icon" onclick="flipCard(${p.id})">🔄 詳情</button>
                                </div>
                            </div>

                            <div class="life-display">
                                <button class="btn-adjust" onclick="changeLife(${p.id}, -1)">-</button>
                                <div class="life-value ${p.life < 0 ? 'negative' : ''}">${p.life}</div>
                                <button class="btn-adjust" onclick="changeLife(${p.id}, 1)">+</button>
                            </div>

                            <div class="status-bar">
                                <div class="status-item">🤢 中毒: <span>${p.poison}</span></div>
                                <div class="status-item">⚔️ 傷: <span>${p.cmdDamage}</span></div>
                            </div>
                        </div>

                        <!-- 卡牌背面 (設定與特殊點數) -->
                        <div class="card-back">
                            <div class="card-header">
                                <div class="player-name">${p.name} - 詳細狀態</div>
                                <button class="btn-icon" onclick="flipCard(${p.id})">↩️ 返回</button>
                            </div>

                            <div style="margin-top: 15px;">
                                <div class="back-section">
                                    <div class="back-title">🤢 中毒計數器 (Poison)</div>
                                    <div class="counter-row">
                                        <button class="counter-btn" onclick="changePoison(${p.id}, -1)">-</button>
                                        <span style="font-weight: bold; font-size: 1.2rem;">${p.poison} / 10</span>
                                        <button class="counter-btn" onclick="changePoison(${p.id}, 1)">+</button>
                                    </div>
                                </div>

                                <div class="back-section">
                                    <div class="back-title">⚔️ 受到最大指揮官傷害</div>
                                    <div class="counter-row">
                                        <button class="counter-btn" onclick="changeCmdDamage(${p.id}, -1)">-</button>
                                        <span style="font-weight: bold; font-size: 1.2rem;">${p.cmdDamage} / 21</span>
                                        <button class="counter-btn" onclick="changeCmdDamage(${p.id}, 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        // 生命值調整 (支援負數血量)
        function changeLife(id, delta) {
            const p = players.find(x => x.id === id);
            if (p) {
                p.life += delta;
                renderCards();
            }
        }

        // 中毒數值調整
        function changePoison(id, delta) {
            const p = players.find(x => x.id === id);
            if (p) {
                p.poison = Math.max(0, p.poison + delta);
                renderCards();
            }
        }

        // 指揮官傷害調整
        function changeCmdDamage(id, delta) {
            const p = players.find(x => x.id === id);
            if (p) {
                p.cmdDamage = Math.max(0, p.cmdDamage + delta);
                renderCards();
            }
        }

        // 切換不死之身模式
        function toggleImmunity(id) {
            const p = players.find(x => x.id === id);
            if (p) {
                p.immunity = !p.immunity;
                renderCards();
            }
        }

        // 翻轉卡牌
        function flipCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.classList.toggle('flipped');
            }
        }

        // 初始渲染
        renderCards();
    </script>
</body>
</html>
