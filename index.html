<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法風雲會 - 決戰計血器</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(15, 12, 25, 0.85);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8a6d1b;
            --crimson: #a91b1b;
            --crimson-glow: #ff4d4d;
            --card-bg: linear-gradient(145deg, #1f1b2c, #120f1a);
            --border-style: 2px solid var(--gold-primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background: #000 url('https://upload.wikimedia.org/wikipedia/en/a/aa/Magic_the_gathering-card_back.jpg') no-repeat center center fixed;
            background-size: contain;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .overlay {
            background: var(--bg-overlay);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 8, 15, 0.9);
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #14101d;
            border-left: 2px solid var(--gold-primary);
            box-shadow: -5px 0 25px rgba(0,0,0,0.8);
            transition: right 0.3s ease;
            z-index: 500;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-drawer.active { right: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
            color: var(--gold-primary);
        }

        .menu-item {
            padding: 12px 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-dark);
            color: #fff;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .btn-magic {
            background: linear-gradient(180deg, var(--gold-primary), var(--gold-dark));
            color: #0f0c19;
            border: 1px solid var(--gold-light);
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        .btn-magic:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .btn-magic:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .view {
            display: none;
            flex: 1;
            padding: 10px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #home-view { gap: 20px; }

        .home-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold-primary);
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        #game-view {
            padding: 5px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 60px;
        }

        .player-card-wrapper {
            perspective: 1000px;
            height: 240px;
            cursor: pointer;
        }

        .player-card {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .player-card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-back {
            transform: rotateY(180deg);
            background: #15101f;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-primary);
            object-fit: cover;
        }

        .card-name {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .monarch-crown {
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.2s;
        }

        .monarch-crown.active {
            opacity: 1;
            filter: drop-shadow(0 0 6px #ffd700);
        }

        .life-display {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212,175,55,0.3);
            margin: 2px 0;
            line-height: 1;
        }

        .life-display.danger {
            color: var(--crimson-glow);
            text-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
        }

        .life-controls {
            display: flex;
            justify-content: space-around;
            gap: 4px;
        }

        .btn-life {
            flex: 1;
            padding: 6px 0;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(212,175,55,0.15);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-life:active {
            background: var(--gold-primary);
            color: #000;
        }

        .status-badges {
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
            justify-content: center;
        }

        .badge {
            background: #2a1f3d;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
        }

        .floating-controls {
            position: fixed;
            bottom: 15px; right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-round {
            width: 50px; height: 50px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .modal-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-mask.active { display: flex; }

        .modal-content {
            background: #181424;
            border: var(--border-style);
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .modal-close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            color: var(--gold-primary);
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 8px;
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--gold-light);
            font-size: 0.9rem;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #0a080f;
            border: 1px solid var(--gold-dark);
            color: #fff;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .player-setup-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .player-setup-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #332a45;
        }

        .avatar-preview {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--gold-primary);
            object-fit: cover;
            cursor: pointer;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .avatar-option {
            width: 100%; aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid transparent;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: var(--gold-primary);
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(10, 8, 15, 0.8);
            border-radius: 8px;
            overflow: hidden;
            font-size: 0.9rem;
        }

        .records-table th, .records-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #2a2038;
        }

        .records-table th {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-primary);
        }

        .win-tag { color: #ffd700; font-weight: bold; }

        .stats-summary {
            margin-top: 15px;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
        }

        .winner-checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
            text-align: left;
        }

        .winner-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="overlay">
    <nav class="navbar">
        <div class="brand">⚔️ MTG Life Counter</div>
        <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    </nav>

    <div class="menu-drawer" id="menuDrawer">
        <div class="menu-header">
            <h3>選單 MENU</h3>
            <button class="hamburger-btn" onclick="toggleMenu()">✕</button>
        </div>
        <button class="menu-item" onclick="navTo('home-view')">🏠 首頁</button>
        <button class="menu-item" onclick="navTo('game-view')">⚔️ 比賽場</button>
        <button class="menu-item" onclick="navTo('records-view')">📜 對戰紀錄</button>
    </div>

    <div id="home-view" class="view active">
        <h1 class="home-title">MAGIC THE GATHERING<br><span style="font-size: 1.3rem; color: #fff;">決戰計血器</span></h1>
        <div id="home-buttons" style="display: flex; flex-direction: column; gap: 15px;">
            <button class="btn-magic" id="btn-continue" style="display:none;" onclick="navTo('game-view')">繼續遊戲</button>
            <button class="btn-magic" onclick="openNewGameModal()">開新局</button>
        </div>
    </div>

    <div id="game-view" class="view">
        <div class="game-grid" id="gameGrid"></div>

        <div class="floating-controls">
            <button class="btn-magic btn-round" onclick="rollD20All()" title="一鍵擲D20">🎲</button>
            <button class="btn-magic btn-round" onclick="openResetModal()" title="重置本局">🔄</button>
        </div>
    </div>

    <div id="records-view" class="view">
        <h2 style="color: var(--gold-primary); margin-bottom: 15px;">對戰歷史紀錄</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn-magic" onclick="exportRecords()">匯出紀錄 (JSON)</button>
            <button class="btn-magic" onclick="document.getElementById('importFile').click()">匯入紀錄</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importRecords(event)">
        </div>

        <table class="records-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>局數</th>
                    <th>姓名/隊伍</th>
                    <th>戰績</th>
                </tr>
            </thead>
            <tbody id="recordsTableBody"></tbody>
        </table>

        <div class="stats-summary">
            <h3 style="color: var(--gold-primary); margin-bottom: 10px;">個人總勝負統計</h3>
            <div id="statsSummaryContent"></div>
        </div>
    </div>
</div>

<div class="modal-mask" id="newGameModal">
    <div class="modal-content">
        <div class="modal-title">開新局設定</div>
        <div class="form-group">
            <label>模式 (必填)</label>
            <select id="modeSelect" onchange="updateSetupForm()">
                <option value="Commander">指揮官</option>
                <option value="TwoHeadedGiant">雙頭巨人</option>
                <option value="Kingdoms">三國殺</option>
            </select>
        </div>
        <div class="form-group">
            <label>人數 (必填)</label>
            <select id="playerCountSelect" onchange="updatePlayerRows()"></select>
        </div>

        <div style="margin-top: 15px;">
            <label style="color: var(--gold-light);">玩家設定</label>
            <div class="player-setup-list" id="playerSetupList"></div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-magic" id="btnStartGame" style="flex:1;" disabled onclick="startGame()">準備好了！開始對戰</button>
            <button class="btn-magic" style="background: #444;" onclick="closeModal('newGameModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="avatarModal">
    <div class="modal-content">
        <div class="modal-title">選擇鵬洛客頭像</div>
        <div class="avatar-grid" id="avatarGrid"></div>
        <button class="btn-magic" style="margin-top: 15px; width: 100%;" onclick="closeModal('avatarModal')">關閉</button>
    </div>
</div>

<div class="modal-mask" id="resetModal">
    <div class="modal-content" style="text-align: center;">
        <div class="modal-title">重置對戰與勝負結算</div>
        <p style="color: #ccc; font-size:0.9rem;">請勾選本局獲勝的個人或隊伍：</p>
        
        <div class="winner-checkbox-group" id="winnerSelectorList"></div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 20px;">
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('same')">目前模式</button>
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('new')">新模式</button>
        </div>
        <button class="btn-magic" style="width: 100%; background: #444;" onclick="closeModal('resetModal')">取消</button>
    </div>
</div>

<div class="modal-mask" id="diceModal">
    <div class="modal-content" style="text-align: center;">
        <button class="modal-close-x" onclick="closeModal('diceModal')">✕</button>
        <div class="modal-title" id="diceWinnerTitle">🎲 擲骰結果：計算中...</div>
        <div id="diceResults" style="font-size: 1.1rem; line-height: 1.8; text-align: left; margin-top: 10px;"></div>
    </div>
</div>

<script>
    // 替換為上傳的 10 張新頭像
    const PLANESWALKERS = [
        { name: "Chandra", url: "https://cards.scryfall.io/art_crop/front/0/1/012e161f-1328-48d3-a9d1-36b13e9a4f48.jpg" },
        { name: "Liliana 1", url: "https://cards.scryfall.io/art_crop/front/d/1/d12c8c97-6491-452c-811d-943441a7ef9f.jpg" },
        { name: "Liliana 2", url: "https://cards.scryfall.io/art_crop/front/9/e/9e7030f4-c2e2-43ce-ac5c-56e7989b559a.jpg" },
        { name: "Kiora", url: "https://cards.scryfall.io/art_crop/front/0/5/0510343d-010f-4886-bb21-e37453d6eb61.jpg" },
        { name: "Jace", url: "https://cards.scryfall.io/art_crop/front/0/e/0e52778c-55d0-40e8-a83d-3965b262d12e.jpg" },
        { name: "Gideon", url: "https://cards.scryfall.io/art_crop/front/9/b/9b5eced6-733f-41c5-849d-64e52f5344c2.jpg" },
        { name: "Nissa", url: "https://cards.scryfall.io/art_crop/front/2/9/29283d01-a89f-431d-b0ed-28821950e303.jpg" },
        { name: "Oko", url: "https://cards.scryfall.io/art_crop/front/3/4/3462a3d0-5552-49fa-9eb7-100960c55f91.jpg" },
        { name: "Vivien", url: "https://cards.scryfall.io/art_crop/front/2/2/2275f0a0-880d-4ef1-8a9b-7e61ef022131.jpg" },
        { name: "Teferi", url: "https://cards.scryfall.io/art_crop/front/5/d/5d10b752-d9cb-419d-a5c4-d4060667b676.jpg" }
    ];

    let state = {
        historyNames: JSON.parse(localStorage.getItem('mtg_historyNames')) || {},
        currentGame: JSON.parse(localStorage.getItem('mtg_currentGame')) || null,
        records: JSON.parse(localStorage.getItem('mtg_records')) || [],
        gameCount: parseInt(localStorage.getItem('mtg_gameCount')) || 1
    };

    let activeSelectingPlayerIndex = null;

    window.onload = function() {
        if (state.currentGame) {
            document.getElementById('btn-continue').style.display = 'block';
        }
        updateRecordsTable();

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.player-card-wrapper')) {
                document.querySelectorAll('.player-card.flipped').forEach(card => {
                    card.classList.remove('flipped');
                });
            }
        });
    };

    function toggleMenu() {
        document.getElementById('menuDrawer').classList.toggle('active');
    }

    function navTo(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('menuDrawer').classList.remove('active');
        
        if (viewId === 'game-view' && state.currentGame) {
            renderGameGrid();
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function openNewGameModal() {
        document.getElementById('newGameModal').classList.add('active');
        updateSetupForm();
    }

    function updateSetupForm() {
        const mode = document.getElementById('modeSelect').value;
        const countSelect = document.getElementById('playerCountSelect');
        const currentCount = countSelect.value;
        countSelect.innerHTML = '';

        if (mode === 'TwoHeadedGiant') {
            [2, 4, 6, 8].forEach(n => countSelect.add(new Option(`${n} 人 (${n/2} 隊)`, n)));
        } else {
            for(let i=2; i<=8; i++) countSelect.add(new Option(`${i} 人`, i));
        }

        if (Array.from(countSelect.options).some(opt => opt.value === currentCount)) {
            countSelect.value = currentCount;
        }

        updatePlayerRows();
    }

    function updatePlayerRows() {
        const mode = document.getElementById('modeSelect').value;
        const count = parseInt(document.getElementById('playerCountSelect').value);
        const container = document.getElementById('playerSetupList');

        const oldInputs = Array.from(container.querySelectorAll('.p-name')).map(i => i.value);
        const oldAvatars = Array.from(container.querySelectorAll('.avatar-preview')).map(img => img.src);

        container.innerHTML = '';
        let rowCount = mode === 'TwoHeadedGiant' ? count / 2 : count;

        for (let i = 0; i < rowCount; i++) {
            const row = document.createElement('div');
            row.className = 'player-setup-row';
            let defaultAvatar = oldAvatars[i] || PLANESWALKERS[i % PLANESWALKERS.length].url;

            if (mode === 'TwoHeadedGiant') {
                let name1 = oldInputs[i * 2] || '';
                let name2 = oldInputs[i * 2 + 1] || '';
                row.innerHTML = `
                    <span style="color:var(--gold-primary); font-size:0.85rem;">隊${i+1}:</span>
                    <input type="text" placeholder="隊友1" class="p-name" value="${name1}" oninput="validateSetupForm()">
                    <input type="text" placeholder="隊友2" class="p-name" value="${name2}" oninput="validateSetupForm()">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" onclick="openAvatarModal(${i})">
                `;
            } else {
                let name = oldInputs[i] || '';
                row.innerHTML = `
                    <input type="text" placeholder="玩家 ${i+1} 姓名" class="p-name" value="${name}" oninput="validateSetupForm()" onchange="autoFillAvatar(this, ${i})">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" onclick="openAvatarModal(${i})">
                `;
            }
            container.appendChild(row);
        }

        validateSetupForm();
    }

    function autoFillAvatar(inputElem, index) {
        const val = inputElem.value.trim();
        if (state.historyNames[val]) {
            document.getElementById(`avatar-prev-${index}`).src = state.historyNames[val];
        }
    }

    function validateSetupForm() {
        const inputs = Array.from(document.querySelectorAll('.p-name'));
        const allFilled = inputs.every(input => input.value.trim() !== '');
        document.getElementById('btnStartGame').disabled = !allFilled;
    }

    function openAvatarModal(playerIndex) {
        activeSelectingPlayerIndex = playerIndex;
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = PLANESWALKERS.map(p => `
            <img src="${p.url}" title="${p.name}" class="avatar-option" onclick="selectAvatar('${p.url}')">
        `).join('');
        document.getElementById('avatarModal').classList.add('active');
    }

    function selectAvatar(url) {
        const img = document.getElementById(`avatar-prev-${activeSelectingPlayerIndex}`);
        if(img) img.src = url;
        closeModal('avatarModal');
    }

    function startGame() {
        const mode = document.getElementById('modeSelect').value;
        const rows = document.querySelectorAll('.player-setup-row');
        let players = [];
        let defaultLife = mode === 'TwoHeadedGiant' ? 50 : 40;

        rows.forEach((row, idx) => {
            if (mode === 'TwoHeadedGiant') {
                const names = Array.from(row.querySelectorAll('.p-name')).map(i => i.value.trim());
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: `${names[0]} & ${names[1]}`,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamage: 0,
                    isMonarch: false
                });
            } else {
                const name = row.querySelector('.p-name').value.trim();
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: name,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamage: 0,
                    isMonarch: false
                });
                state.historyNames[name] = avatar;
            }
        });

        localStorage.setItem('mtg_historyNames', JSON.stringify(state.historyNames));
        state.currentGame = { mode: mode, players: players };

        saveCurrentGame();
        closeModal('newGameModal');
        navTo('game-view');
    }

    function saveCurrentGame() {
        localStorage.setItem('mtg_currentGame', JSON.stringify(state.currentGame));
        document.getElementById('btn-continue').style.display = 'block';
    }

    function renderGameGrid() {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';
        if (!state.currentGame) return;

        state.currentGame.players.forEach((p, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'player-card-wrapper';

            cardWrapper.onclick = function(e) {
                if (e.target.closest('button') || e.target.closest('.monarch-crown')) return;
                document.getElementById(`card-${index}`).classList.toggle('flipped');
            };

            cardWrapper.innerHTML = `
                <div class="player-card" id="card-${index}">
                    <div class="card-front">
                        <div class="card-header">
                            <div class="player-info">
                                <img src="${p.avatar}" class="card-avatar">
                                <div class="card-name">${p.name}</div>
                            </div>
                            ${state.currentGame.mode === 'Kingdoms' ? 
                                `<div class="monarch-crown ${p.isMonarch ? 'active' : ''}" onclick="toggleMonarch(${index})" title="指定主公">👑</div>` : ''}
                        </div>
                        <div class="life-display ${p.life < 10 ? 'danger' : ''}">${p.life}</div>
                        <div class="status-badges">
                            ${p.poison > 0 ? `<span class="badge">🤢 毒:${p.poison}</span>` : ''}
                            ${p.cmdDamage > 0 ? `<span class="badge">⚔️ 傷:${p.cmdDamage}</span>` : ''}
                        </div>
                        <div class="life-controls">
                            <button class="btn-life" onclick="changeLife(${index}, -5)">-5</button>
                            <button class="btn-life" onclick="changeLife(${index}, -1)">-1</button>
                            <button class="btn-life" onclick="changeLife(${index}, 1)">+1</button>
                            <button class="btn-life" onclick="changeLife(${index}, 5)">+5</button>
                        </div>
                    </div>

                    <div class="card-back">
                        <div class="card-header">
                            <div class="card-name" style="color:var(--gold-primary)">${p.name}</div>
                        </div>
                        <div style="margin: 2px 0;">
                            <label style="font-size:0.75rem;">🤢 中毒標記</label>
                            <div class="life-controls">
                                <button class="btn-life" onclick="changeStatus(${index}, 'poison', -1)">-1</button>
                                <span style="font-size: 1.1rem; align-self: center;">${p.poison}</span>
                                <button class="btn-life" onclick="changeStatus(${index}, 'poison', 1)">+1</button>
                            </div>
                        </div>
                        <div style="margin: 2px 0;">
                            <label style="font-size:0.75rem;">⚔️ 指揮官傷害</label>
                            <div class="life-controls">
                                <button class="btn-life" onclick="changeStatus(${index}, 'cmdDamage', -1)">-1</button>
                                <span style="font-size: 1.1rem; align-self: center;">${p.cmdDamage}</span>
                                <button class="btn-life" onclick="changeStatus(${index}, 'cmdDamage', 1)">+1</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(cardWrapper);
        });
    }

    function changeLife(index, delta) {
        let p = state.currentGame.players[index];
        p.life = Math.max(0, p.life + delta);
        saveCurrentGame();
        renderGameGrid();
    }

    function changeStatus(index, type, delta) {
        let p = state.currentGame.players[index];
        p[type] = Math.max(0, p[type] + delta);
        saveCurrentGame();
        renderGameGrid();
    }

    function toggleMonarch(index) {
        state.currentGame.players.forEach((p, i) => {
            if (i === index) {
                p.isMonarch = !p.isMonarch;
                p.life = p.isMonarch ? 50 : 40;
            } else {
                p.isMonarch = false;
            }
        });
        saveCurrentGame();
        renderGameGrid();
    }

    function rollD20All() {
        const results = document.getElementById('diceResults');
        const titleElem = document.getElementById('diceWinnerTitle');
        results.innerHTML = '';

        let maxRoll = -1;
        let winners = [];

        state.currentGame.players.forEach(p => {
            const roll = Math.floor(Math.random() * 20) + 1;
            if (roll > maxRoll) {
                maxRoll = roll;
                winners = [p.name];
            } else if (roll === maxRoll) {
                winners.push(p.name);
            }
            results.innerHTML += `<div><strong>${p.name}</strong> 擲出了 🎲 <span style="color:var(--gold-primary); font-size:1.3rem;">${roll}</span> 點</div>`;
        });

        titleElem.innerHTML = `🎲 擲骰結果：<span style="color:#ffd700">${winners.join(' & ')}</span> 獲勝！`;
        document.getElementById('diceModal').classList.add('active');
    }

    function openResetModal() {
        if (!state.currentGame) return;
        const list = document.getElementById('winnerSelectorList');
        list.innerHTML = '';

        state.currentGame.players.forEach((p, idx) => {
            list.innerHTML += `
                <label class="winner-checkbox-item">
                    <input type="checkbox" class="winner-checkbox" value="${idx}">
                    <span>👑 ${p.name} (剩餘血量: ${p.life})</span>
                </label>
            `;
        });

        document.getElementById('resetModal').classList.add('active');
    }

    function confirmReset(type) {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        let winnersIndices = [];
        checkboxes.forEach(cb => {
            if (cb.checked) winnersIndices.push(parseInt(cb.value));
        });

        recordGameResult(winnersIndices);
        closeModal('resetModal');

        if (type === 'same') {
            let defaultLife = state.currentGame.mode === 'TwoHeadedGiant' ? 50 : 40;
            state.currentGame.players.forEach(p => {
                p.life = p.isMonarch ? 50 : defaultLife;
                p.poison = 0;
                p.cmdDamage = 0;
            });
            saveCurrentGame();
            renderGameGrid();
        } else {
            openNewGameModal();
        }
    }

    function recordGameResult(winnersIndices) {
        if (!state.currentGame) return;

        let dateStr = new Date().toLocaleDateString();

        state.currentGame.players.forEach((p, idx) => {
            let isWin = winnersIndices.includes(idx);
            state.records.push({
                date: dateStr,
                gameIndex: state.gameCount,
                name: p.name,
                result: isWin ? 'WIN' : 'LOSE'
            });
        });

        state.gameCount++;
        localStorage.setItem('mtg_records', JSON.stringify(state.records));
        localStorage.setItem('mtg_gameCount', state.gameCount);
        updateRecordsTable();
    }

    function updateRecordsTable() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        state.records.slice().reverse().forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.date}</td>
                    <td>第 ${r.gameIndex} 局</td>
                    <td>${r.name}</td>
                    <td>${r.result === 'WIN' ? '<span class="win-tag">👑 贏</span>' : '輸'}</td>
                </tr>
            `;
        });

        const stats = {};
        state.records.forEach(r => {
            const individualNames = r.name.split('&').map(s => s.trim());
            individualNames.forEach(name => {
                if (!stats[name]) stats[name] = { win: 0, lose: 0 };
                if (r.result === 'WIN') stats[name].win++;
                else stats[name].lose++;
            });
        });

        const summaryElem = document.getElementById('statsSummaryContent');
        summaryElem.innerHTML = Object.keys(stats).map(name => `
            <div style="display:inline-block; margin-right: 15px; margin-bottom: 8px;">
                <strong>${name}:</strong> ${stats[name].win}勝 / ${stats[name].lose}敗 (勝率: ${Math.round(stats[name].win/(stats[name].win+stats[name].lose)*100 || 0)}%)
            </div>
        `).join('');
    }

    function exportRecords() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.records, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mtg_records_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
    }

    function importRecords(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    state.records = importedData;
                    localStorage.setItem('mtg_records', JSON.stringify(state.records));
                    updateRecordsTable();
                    alert("對戰紀錄匯入成功！");
                }
            } catch (err) {
                alert("檔案格式錯誤，匯入失敗。");
            }
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>
</body>
</html>
