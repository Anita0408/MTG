    const PLANESWALKERS = [
        { name: "Rowan Kenrith", url: "https://images.ctfassets.net/s5n2t79q9icq/1sqcHwy3RJKGZ2BT5B8xsi/27e26027ca67551f68860f89051c7cdc/rowan-kenrith-300.jpg" },
        { name: "The Wanderer", url: "https://images.ctfassets.net/s5n2t79q9icq/3xwuZfGjME99g4m8UV8Tkx/673c5305e0216b992ad020cd7bf85b47/the-wanderer-300.jpg" },
        { name: "Basri Khet", url: "https://images.ctfassets.net/s5n2t79q9icq/1q2WnoQyMIPY5JeS47evum/a107915c16efa6ebf586047cc1c409c8/basri-khet-300.jpg" },
        { name: "Elspeth Tirel", url: "https://images.ctfassets.net/s5n2t79q9icq/c0HWQ5xD293WdkqUd3vUN/abe4d649a0ca25a7a260c32377df7094/elspeth-tirel-300.jpg" },

        { name: "Serra", url: "https://images.ctfassets.net/s5n2t79q9icq/78Bo4S43kxvjlaGYbcK8JU/070181e909364fe85c9b5d58e8778bfd/serra-300.jpg" },

        { name: "Mu Yanling", url: "https://images.ctfassets.net/s5n2t79q9icq/6H7suxzk8ecyTTjvN7TCsO/e117e3b5c38137a45c840f5105d49a1b/mu-yanling-300.jpg" },

    const SKULL_SVG_MARKUP = `
        <svg class="skull-svg" viewBox="0 0 512 512">
            <defs>
                <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ff0000" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#800000" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="skullMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff4d4d"/>
                    <stop offset="40%" stop-color="#aa1111"/>
                    <stop offset="100%" stop-color="#2a0000"/>
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="230" fill="url(#magicGlow)" />
            <circle cx="256" cy="256" r="210" fill="none" stroke="#ff1a1a" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />
            <circle cx="256" cy="256" r="190" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4" />
            
            <path d="M256 50c-75 0-135 55-135 130 0 35 15 68 40 92l-10 65c-2 10 5 18 15 18h30c4 0 8-2 10-6l10-25c14 6 29 9 45 9s31-3 45-9l10 25c2 4 6 6 10 6h30c10 0 17-8 15-18l-10-65c25-24 40-57 40-92 0-75-60-130-135-130zm-50 120c15 0 25 15 25 35s-10 35-25 35-25-15-25-35 10-35 25-35zm100 0c15 0 25 15 25 35s-10 35-25 35-25-15-25-35 10-35 25-35zm-50 90c-12 0-22 8-25 20l-15 40h80l-15-40c-3-12-13-20-25-20z" 
                  fill="url(#skullMetallic)" stroke="#ff4d4d" stroke-width="3" filter="drop-shadow(0 0 8px rgba(255,0,0,0.6))" />
            
            <circle class="skull-eye-fire" cx="206" cy="205" r="16" fill="#ff1a1a" />
            <circle class="skull-eye-fire" cx="306" cy="205" r="16" fill="#ff1a1a" />
            <circle cx="206" cy="205" r="6" fill="#ffffff" />
            <circle cx="306" cy="205" r="6" fill="#ffffff" />
        </svg>
    `;

    let state = {
        historyNames: JSON.parse(localStorage.getItem('mtg_historyNames')) || {},
        currentGame: JSON.parse(localStorage.getItem('mtg_currentGame')) || null,
        records: JSON.parse(localStorage.getItem('mtg_records')) || [],
        gameCount: parseInt(localStorage.getItem('mtg_gameCount')) || 1
    };

    let activeSelectingPlayerIndex = null;
    let pendingWinnersIndices = [];

    function bindHoldEvent(element, actionFn) {
        if (!element) return;
        let holdTimer = null;
        let holdInterval = null;
        let activePointerId = null;

        const stop = (e) => {
            if (activePointerId !== null && element.releasePointerCapture) {
                try { element.releasePointerCapture(activePointerId); } catch(err){}
                activePointerId = null;
            }
            if (holdTimer) clearTimeout(holdTimer);
            if (holdInterval) clearInterval(holdInterval);
            holdTimer = null;
            holdInterval = null;
        };

        const start = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            stop();

            activePointerId = e.pointerId;
            if (element.setPointerCapture) {
                try { element.setPointerCapture(e.pointerId); } catch(err){}
            }

            actionFn();

            holdTimer = setTimeout(() => {
                let speed = 150;
                const runStep = () => {
                    actionFn();
                    speed = Math.max(60, speed * 0.9);
                    holdInterval = setTimeout(runStep, speed);
                };
                runStep();
            }, 350);
        };

        element.addEventListener('pointerdown', start);
        element.addEventListener('pointerup', stop);
        element.addEventListener('pointercancel', stop);
        element.addEventListener('pointerleave', stop);
    }

    window.onload = function() {
        if (state.currentGame) {
            document.getElementById('btn-continue').style.display = 'flex';
        }
        updateRecordsTable();
    };

    function flipCard(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) cardElem.classList.add('flipped');
    }

    function flipCardFront(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) cardElem.classList.remove('flipped');
    }

    function toggleMenu() {
        document.getElementById('menuDrawer').classList.toggle('active');
        document.getElementById('menuOverlay').classList.toggle('active');
        document.querySelectorAll('.magic-menu-toggle').forEach(btn => btn.classList.toggle('active'));
    }

    function navTo(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('menuDrawer').classList.remove('active');
        document.getElementById('menuOverlay').classList.remove('active');
        document.querySelectorAll('.magic-menu-toggle').forEach(btn => btn.classList.remove('active'));
        
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
        const activeMenuItem = document.getElementById(`menu-${viewId}`);
        if (activeMenuItem) activeMenuItem.classList.add('active');

        if (viewId === 'game-view') {
            renderGameGrid();
        } else if (viewId === 'records-view') {
            updateRecordsTable();
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function openNewGameModal() {
        document.getElementById('newGameModal').classList.add('active');
        updateSetupForm();
    }

    function updateSetupForm() {
        const mode = document.getElementById('modeSelect').value;
        const countSelect = document.getElementById('playerCountSelect');
        const currentCount = countSelect.value;
        countSelect.innerHTML = '';

        if (mode === 'TwoHeadedGiant') {
            [4, 6, 8].forEach(n => countSelect.add(new Option(`${n} 人 (${n/2} 隊)`, n)));
        } else {
            for(let i=2; i<=8; i++) countSelect.add(new Option(`${i} 人`, i));
        }

        if (Array.from(countSelect.options).some(opt => opt.value === currentCount)) {
            countSelect.value = currentCount;
        }

        updatePlayerRows();
    }

    function updatePlayerRows() {
        const mode = document.getElementById('modeSelect').value;
        const count = parseInt(document.getElementById('playerCountSelect').value);
        const container = document.getElementById('playerSetupList');

        const oldInputs = Array.from(container.querySelectorAll('.p-name')).map(i => i.value);
        const oldAvatars = Array.from(container.querySelectorAll('.avatar-preview')).map(img => img.src);

        container.innerHTML = '';
        let rowCount = mode === 'TwoHeadedGiant' ? count / 2 : count;

        for (let i = 0; i < rowCount; i++) {
            const row = document.createElement('div');
            row.className = 'player-setup-row';
            let defaultAvatar = oldAvatars[i] || PLANESWALKERS[i % PLANESWALKERS.length].url;

            if (mode === 'TwoHeadedGiant') {
                let name1 = oldInputs[i * 2] || '';
                let name2 = oldInputs[i * 2 + 1] || '';
                row.innerHTML = `
                    <span class="team-label">${i+1}</span>
                    <input type="text" placeholder="隊友 1" class="p-name" value="${name1}" oninput="validateSetupForm()">
                    <input type="text" placeholder="隊友 2" class="p-name" value="${name2}" oninput="validateSetupForm()">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            } else {
                let name = oldInputs[i] || '';
                row.innerHTML = `
                    <input type="text" placeholder="玩家 ${i+1}" class="p-name" value="${name}" oninput="validateSetupForm()" onchange="autoFillAvatar(this, ${i})">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            }
            container.appendChild(row);
        }

        validateSetupForm();
    }

    function autoFillAvatar(inputElem, index) {
        const val = inputElem.value.trim();
        if (state.historyNames[val]) {
            document.getElementById(`avatar-prev-${index}`).src = state.historyNames[val];
        }
    }

    function validateSetupForm() {
        const inputs = Array.from(document.querySelectorAll('.p-name'));
        const allFilled = inputs.every(input => input.value.trim() !== '');
        document.getElementById('btnStartGame').disabled = !allFilled;
    }

    function openAvatarModal(playerIndex) {
        activeSelectingPlayerIndex = playerIndex;
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = PLANESWALKERS.map(p => `
            <img src="${p.url}" title="${p.name}" class="avatar-option" referrerpolicy="no-referrer" onclick="selectAvatar('${p.url}')">
        `).join('');
        document.getElementById('avatarModal').classList.add('active');
    }

    function selectAvatar(url) {
        const img = document.getElementById(`avatar-prev-${activeSelectingPlayerIndex}`);
        if(img) img.src = url;
        closeModal('avatarModal');
    }

    function startGame() {
        const mode = document.getElementById('modeSelect').value;
        const rows = document.querySelectorAll('.player-setup-row');
        let players = [];
        let defaultLife = mode === 'TwoHeadedGiant' ? 50 : 40;

        rows.forEach((row, idx) => {
            if (mode === 'TwoHeadedGiant') {
                const names = Array.from(row.querySelectorAll('.p-name')).map(i => i.value.trim());
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: `${names[0]} & ${names[1]}`,
                    members: [names[0], names[1]],
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
            } else {
                const name = row.querySelector('.p-name').value.trim();
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: name,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
                state.historyNames[name] = avatar;
            }
        });

        localStorage.setItem('mtg_historyNames', JSON.stringify(state.historyNames));
        state.currentGame = { mode: mode, players: players };

        saveCurrentGame();
        closeModal('newGameModal');
        navTo('game-view');
    }

    function saveCurrentGame() {
        localStorage.setItem('mtg_currentGame', JSON.stringify(state.currentGame));
        document.getElementById('btn-continue').style.display = 'flex';
    }

    function checkEliminated(p) {
        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(d => { if (d > maxCmdDmg) maxCmdDmg = d; });
        }
        const conditionMet = (p.life <= 0 || p.poison >= 10 || maxCmdDmg >= 21);
        return conditionMet && !p.isImmune;
    }

    function renderGameGrid() {
        const grid = document.getElementById('gameGrid');
        const controls = document.getElementById('floatingControls');
        grid.innerHTML = '';

        if (!state.currentGame || !state.currentGame.players || state.currentGame.players.length === 0) {
            if (controls) controls.style.display = 'none';
            return;
        }

        if (controls) controls.style.display = 'flex';

        const count = state.currentGame.players.length;
        const isLayoutLarge = (count >= 2 && count <= 3);
        const isKingdoms = (state.currentGame.mode === 'Kingdoms');

        if (isLayoutLarge) {
            grid.classList.add('layout-large');
        } else {
            grid.classList.remove('layout-large');
        }

        state.currentGame.players.forEach((p, index) => {
            const cardWrapper = document.createElement('div');
            const isTwoPlayerMode = (count === 2);
            if (isTwoPlayerMode && index === 1) {
                cardWrapper.className = 'player-card-wrapper seat-rotated';
            } else {
                cardWrapper.className = 'player-card-wrapper';
            }

            const isEliminated = checkEliminated(p);

            cardWrapper.innerHTML = `
                <div class="player-card ${isEliminated ? 'eliminated' : ''} ${p.isImmune ? 'immunity-active' : ''}" id="card-${index}">
                    <div class="skull-overlay">${SKULL_SVG_MARKUP}</div>

                    <div class="card-front" style="background-image: url('${p.avatar}');" onclick="flipCard(${index})">
                        <div class="card-header">
                            <div class="player-info">
                                <div class="card-name">${p.name}</div>
                            </div>
                            <div class="action-icon-column">
                                ${isKingdoms ? `
                                    <div class="monarch-crown ${p.isMonarch ? 'active' : ''}" onclick="event.stopPropagation(); toggleMonarch(${index})" title="指定主公">👑</div>
                                ` : ''}
                                <div class="icon-btn-immunity ${p.isImmune ? 'active' : ''}" onclick="event.stopPropagation(); toggleImmunity(${index})" title="切換不死之身">🛡️</div>
                            </div>
                        </div>
                        <div class="life-display ${p.life <= 10 ? 'danger' : ''}" id="life-val-${index}">${p.life}</div>
                        
                        <div class="status-badges" id="status-badges-${index}"></div>

                        <div class="life-controls" onclick="event.stopPropagation()">
                            <button class="btn-life btn-life-large btn-minus">-1</button>
                            <button class="btn-life btn-life-large btn-plus">+1</button>
                        </div>
                    </div>

                    <div class="card-back" style="background-image: url('${p.avatar}');">
                        <div class="card-back-body">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:bold; color:var(--gold-light); font-size:0.9rem;">${p.name}</span>
                                <button class="btn-flip-back" onclick="event.stopPropagation(); flipCardFront(${index})" title="翻回正面" aria-label="翻回正面">
                                    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                                </button>
                            </div>

                            <div class="status-row">
                                <div class="status-title">🧪 中毒標記</div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn-life btn-status-ctrl btn-poison-minus">-1</button>
                                    <button class="btn-life btn-status-ctrl btn-poison-plus">+1</button>
                                </div>
                            </div>

                            <div class="status-row">
                                <div class="status-title">⚔️ 指揮官傷害</div>
                                <button class="btn-magic" id="cmd-btn-${index}" style="width:100%; padding: 6px 8px; font-size:0.85rem; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.5); margin-top:2px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" onclick="event.stopPropagation(); openCmdDamageModal(${index})">
                                    傷害列表
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            bindHoldEvent(cardWrapper.querySelector('.btn-minus'), () => changeLife(index, -1));
            bindHoldEvent(cardWrapper.querySelector('.btn-plus'), () => changeLife(index, 1));
            bindHoldEvent(cardWrapper.querySelector('.btn-poison-minus'), () => changeStatus(index, 'poison', -1));
            bindHoldEvent(cardWrapper.querySelector('.btn-poison-plus'), () => changeStatus(index, 'poison', 1));

            grid.appendChild(cardWrapper);
            updateCardBadgesUI(index);
        });
    }

    function toggleImmunity(index) {
        const p = state.currentGame.players[index];
        p.isImmune = !p.isImmune;
        saveCurrentGame();
        renderGameGrid();
    }

    function updateCardBadgesUI(index) {
        const p = state.currentGame.players[index];
        const badgesContainer = document.getElementById(`status-badges-${index}`);
        const cmdBtn = document.getElementById(`cmd-btn-${index}`);
        const cardElem = document.getElementById(`card-${index}`);

        if (!badgesContainer) return;

        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(dmg => {
                if (dmg > maxCmdDmg) maxCmdDmg = dmg;
            });
        }

        badgesContainer.innerHTML = `
            ${p.poison > 0 ? `<span class="badge ${p.poison >= 8 ? 'warning-glow' : ''}">🧪 ${p.poison}</span>` : ''}
            ${maxCmdDmg > 0 ? `
                <span class="badge ${maxCmdDmg >= 15 ? 'warning-glow' : ''}" onclick="event.stopPropagation(); openCmdDamageModal(${index})">
                    ⚔️ ${maxCmdDmg}
                </span>
            ` : ''}
        `;

        if (cmdBtn) {
            cmdBtn.innerText = `傷害列表 (最高: ${maxCmdDmg})`;
        }

        if (cardElem) {
            const isEliminated = checkEliminated(p);
            if (isEliminated) {
                cardElem.classList.add('eliminated');
            } else {
                cardElem.classList.remove('eliminated');
            }
        }
    }

    function changeLife(index, delta) {
        let p = state.currentGame.players[index];
        p.life += delta;
        saveCurrentGame();

        const lifeDisplay = document.getElementById(`life-val-${index}`);
        if (lifeDisplay) {
            lifeDisplay.innerText = p.life;
            if (p.life <= 10) {
                lifeDisplay.classList.add('danger');
            } else {
                lifeDisplay.classList.remove('danger');
            }
        }
        updateCardBadgesUI(index);
    }

    function changeStatus(index, type, delta) {
        let p = state.currentGame.players[index];
        p[type] = Math.max(0, (p[type] || 0) + delta);
        saveCurrentGame();
        updateCardBadgesUI(index);
    }

    function openCmdDamageModal(victimIndex) {
        const victim = state.currentGame.players[victimIndex];
        const is2HG = state.currentGame.mode === 'TwoHeadedGiant';
        
        document.getElementById('cmdModalTitle').innerText = `⚔️ 受到的指揮官傷害`;
        
        const listContainer = document.getElementById('cmdDamageList');
        listContainer.innerHTML = '';

        if (!victim.cmdDamages) victim.cmdDamages = {};

        state.currentGame.players.forEach((attacker, attackerIdx) => {
            if (attackerIdx === victimIndex) return;

            let attackerList = [];
            if (is2HG && attacker.members && attacker.members.length > 0) {
                attackerList = attacker.members.map(m => ({ name: m, avatar: attacker.avatar }));
            } else {
                attackerList = [{ name: attacker.name, avatar: attacker.avatar }];
            }

            attackerList.forEach(atk => {
                const currentDmg = victim.cmdDamages[atk.name] || 0;

                const row = document.createElement('div');
                row.className = 'cmd-damage-item';
                row.innerHTML = `
                    <div class="cmd-damage-player">
                        <img src="${atk.avatar}" class="cmd-damage-avatar" referrerpolicy="no-referrer">
                        <span class="cmd-damage-player-name">${atk.name}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                        <span id="cmd-val-${victimIndex}-${atk.name}" style="font-size: 1.1rem; font-weight: bold; color: ${currentDmg >= 15 ? 'var(--crimson-glow)' : 'var(--gold-primary)'}">
                            ${currentDmg} / 21
                        </span>
                        <div style="display: flex; gap: 4px;">
                            <button class="btn-life btn-status-ctrl btn-cmd-minus" style="width:36px;">-1</button>
                            <button class="btn-life btn-status-ctrl btn-cmd-plus" style="width:36px;">+1</button>
                        </div>
                    </div>
                `;

                bindHoldEvent(row.querySelector('.btn-cmd-minus'), () => changeCmdDamageDetail(victimIndex, atk.name, -1));
                bindHoldEvent(row.querySelector('.btn-cmd-plus'), () => changeCmdDamageDetail(victimIndex, atk.name, 1));

                listContainer.appendChild(row);
            });
        });

        document.getElementById('cmdDamageModal').classList.add('active');
    }

    function changeCmdDamageDetail(victimIndex, attackerName, delta) {
        const victim = state.currentGame.players[victimIndex];
        if (!victim.cmdDamages) victim.cmdDamages = {};
        
        let current = victim.cmdDamages[attackerName] || 0;
        let updated = Math.max(0, current + delta);
        victim.cmdDamages[attackerName] = updated;

        saveCurrentGame();
        
        const valElem = document.getElementById(`cmd-val-${victimIndex}-${attackerName}`);
        if (valElem) {
            valElem.innerText = `${updated} / 21`;
            valElem.style.color = updated >= 15 ? 'var(--crimson-glow)' : 'var(--gold-primary)';
        }

        updateCardBadgesUI(victimIndex);
    }

    function toggleMonarch(index) {
        state.currentGame.players.forEach((p, i) => {
            if (i === index) {
                p.isMonarch = !p.isMonarch;
                p.life = p.isMonarch ? 50 : 40;
            } else {
                p.isMonarch = false;
            }
        });
        saveCurrentGame();
        renderGameGrid();
    }

    function rollD20All() {
        const results = document.getElementById('diceResults');
        const titleElem = document.getElementById('diceWinnerTitle');
        const closeBtn = document.getElementById('btnDiceClose');

        titleElem.innerHTML = `🎲 擲骰進行中...`;
        closeBtn.style.display = 'none';
        document.getElementById('diceModal').classList.add('active');

        let contenders = state.currentGame.players.map(p => ({ name: p.name }));
        let roundLogs = [];
        let round = 1;
        let finalWinner = "";

        while (contenders.length > 1) {
            let log = { round: round, rolls: [], isTie: false };
            let maxRoll = -1;
            let currentWinners = [];

            contenders.forEach(c => {
                const roll = Math.floor(Math.random() * 20) + 1;
                log.rolls.push({ name: c.name, roll: roll });
                if (roll > maxRoll) {
                    maxRoll = roll;
                    currentWinners = [{ name: c.name, roll: roll }];
                } else if (roll === maxRoll) {
                    currentWinners.push({ name: c.name, roll: roll });
                }
            });

            if (currentWinners.length === 1) {
                finalWinner = currentWinners[0].name;
                roundLogs.push(log);
                break;
            } else {
                log.isTie = true;
                roundLogs.push(log);
                contenders = currentWinners;
                round++;
            }
        }

        let startTime = Date.now();
        let animInterval = setInterval(() => {
            let elapsedTime = Date.now() - startTime;
            if (elapsedTime < 1000) {
                let randomRolls = state.currentGame.players.map(p => 
                    `<div><strong>${p.name}</strong> 🎲 <span class="dice-rolling">${Math.floor(Math.random() * 20) + 1}</span></div>`
                ).join('');
                results.innerHTML = `<div style="text-align:center;">${randomRolls}</div>`;
            } else {
                clearInterval(animInterval);
                titleElem.innerHTML = `由 <span style="color:#ffd700">${finalWinner}</span> 開始遊戲`;
                closeBtn.style.display = 'block';

                let finalHtml = '';
                roundLogs.forEach(log => {
                    if (log.round > 1) {
                        finalHtml += `<div style="color:var(--gold-primary); margin-top:8px; font-weight:bold; border-top:1px dashed #444; padding-top:4px;">⚠️ 出現最高平手！進行第 ${log.round} 輪同分重擲：</div>`;
                    }
                    log.rolls.forEach(r => {
                        finalHtml += `<div><strong>${r.name}</strong> 擲出 🎲 <span style="color:var(--gold-primary); font-size:1.2rem; font-weight:bold;">${r.roll}</span> 點</div>`;
                    });
                });
                results.innerHTML = finalHtml;
            }
        }, 80);
    }

    function openResetModal() {
        if (!state.currentGame) return;
        const list = document.getElementById('winnerSelectorList');
        list.innerHTML = '';

        state.currentGame.players.forEach((p, idx) => {
            list.innerHTML += `
                <label class="winner-checkbox-item">
                    <input type="checkbox" class="winner-checkbox" value="${idx}" onchange="validateWinnerSelection()">
                    <div class="custom-checkbox"></div>
                    <img src="${p.avatar}" class="winner-avatar" referrerpolicy="no-referrer">
                    <span style="font-weight:bold; color:var(--gold-light); flex:1;">${p.name}</span>
                    <span style="font-size:0.85rem; color:#aaa;">(血量: ${p.life})</span>
                </label>
            `;
        });

        validateWinnerSelection();
        document.getElementById('resetModal').classList.add('active');
    }

    function validateWinnerSelection() {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
        const btnConfirm = document.getElementById('btnConfirmNextGame');
        if (btnConfirm) {
            btnConfirm.disabled = !anyChecked;
        }
    }

    function handleConfirmNextGame() {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        pendingWinnersIndices = [];
        checkboxes.forEach(cb => {
            if (cb.checked) pendingWinnersIndices.push(parseInt(cb.value));
        });

        closeModal('resetModal');
        document.getElementById('postResetModal').classList.add('active');
    }

    function executePostReset(type) {
        recordGameResult(pendingWinnersIndices);
        closeModal('postResetModal');

        if (type === 'same') {
            let defaultLife = state.currentGame.mode === 'TwoHeadedGiant' ? 50 : 40;
            state.currentGame.players.forEach(p => {
                p.life = p.isMonarch ? 50 : defaultLife;
                p.poison = 0;
                p.cmdDamages = {};
                p.isImmune = false;
            });
            saveCurrentGame();
            renderGameGrid();
        } else {
            openNewGameModal();
        }
    }

    function recordGameResult(winnersIndices) {
        if (!state.currentGame) return;

        let dateStr = new Date().toLocaleDateString();
        let modeName = state.currentGame.mode === 'TwoHeadedGiant' ? '雙頭巨人' : (state.currentGame.mode === 'Kingdoms' ? '三國殺' : '指揮官');

        let lastRecordGroup = state.records.length > 0 ? state.records[state.records.length - 1] : null;
        if (!lastRecordGroup || lastRecordGroup.date !== dateStr) {
            state.gameCount = 1;
        }

        let playersSnapshot = state.currentGame.players.map(p => ({
            name: p.name,
            life: p.life,
            isWinner: winnersIndices.includes(p.id)
        }));

        let winnersNames = playersSnapshot.filter(p => p.isWinner).map(p => p.name);

        state.records.push({
            date: dateStr,
            gameIndex: state.gameCount,
            mode: modeName,
            winners: winnersNames,
            players: playersSnapshot
        });

        state.gameCount++;
        localStorage.setItem('mtg_records', JSON.stringify(state.records));
        localStorage.setItem('mtg_gameCount', state.gameCount);
        updateRecordsTable();
    }

    function toggleRowDetail(rowId) {
        const detailRow = document.getElementById(rowId);
        if (detailRow) {
            detailRow.style.display = detailRow.style.display === 'none' ? 'table-row' : 'none';
        }
    }

    function updateRecordsTable() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        let formattedRecords = state.records.map(r => {
            if (r.players && Array.isArray(r.players)) return r;
            return {
                date: r.date,
                gameIndex: r.gameIndex || 1,
                mode: '指揮官',
                winners: r.result === 'WIN' ? [r.name] : [],
                players: [{ name: r.name, isWinner: r.result === 'WIN', life: '-' }]
            };
        });

        formattedRecords.sort((a, b) => {
            let dateA = new Date(a.date).getTime();
            let dateB = new Date(b.date).getTime();
            
            if (dateA === dateB) {
                return (b.gameIndex || 1) - (a.gameIndex || 1);
            }
            return dateB - dateA;
        });

        formattedRecords.forEach((r, idx) => {
            const detailRowId = `history-detail-${idx}`;
            const winnersText = r.winners.length > 0 ? `<span class="win-tag">${r.winners.join(', ')}</span>` : '<span style="color:#aaa;">無贏家記錄</span>';

            tbody.innerHTML += `
                <tr class="history-main-row" onclick="toggleRowDetail('${detailRowId}')">
                    <td>${r.date}</td>
                    <td>第 ${r.gameIndex} 局</td>
                    <td>${r.mode || '指揮官'}</td>
                    <td>${winnersText}</td>
                </tr>
                <tr id="${detailRowId}" class="history-detail-row">
                    <td colspan="4">
                        <div class="history-detail-content">
                            <strong>📊 本局參與玩家與血量結算：</strong><br>
                            ${r.players.map(p => `• ${p.name}：${p.isWinner ? '<strong style="color:#ffd700;">[獲勝]</strong>' : '落敗'} (最終血量: ${p.life})`).join('<br>')}
                        </div>
                    </td>
                </tr>
            `;
        });

        const statsMap = {};

        formattedRecords.forEach((r, recordIndex) => {
            r.players.forEach(p => {
                if (!statsMap[p.name]) {
                    statsMap[p.name] = { name: p.name, win: 0, lose: 0, firstIndex: recordIndex };
                }
                if (p.isWinner) statsMap[p.name].win++;
                else statsMap[p.name].lose++;
            });
        });

        const statsArray = Object.values(statsMap).map(s => {
            const total = s.win + s.lose;
            const rate = total > 0 ? Math.round((s.win / total) * 100) : 0;
            return { ...s, total, rate };
        });

        statsArray.sort((a, b) => b.rate - a.rate || b.win - a.win);

        const summaryElem = document.getElementById('statsSummaryContent');
        if (statsArray.length === 0) {
            summaryElem.innerHTML = `<div style="color:#aaa;">尚無統計數據</div>`;
        } else {
            summaryElem.innerHTML = statsArray.map(s => `
                <div class="stats-item">
                    <div class="stats-info-row">
                        <span><strong>${s.name}</strong></span>
                        <span style="font-size: 0.85rem; color: var(--gold-light);">${s.win}勝 / ${s.lose}敗 (勝率: ${s.rate}%)</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${s.rate}%;"></div>
                    </div>
                </div>
            `).join('');
        }
    }

    function exportRecords() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.records, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mtg_records_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
    }

    function importRecords(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    let addedCount = 0;
                    importedData.forEach(importedRec => {
                        const isDuplicate = state.records.some(existingRec => 
                            existingRec.date === importedRec.date &&
                            existingRec.gameIndex === importedRec.gameIndex &&
                            JSON.stringify(existingRec.winners) === JSON.stringify(importedRec.winners)
                        );

                        if (!isDuplicate) {
                            state.records.push(importedRec);
                            addedCount++;
                        }
                    });

                    state.records.sort((a, b) => a.gameIndex - b.gameIndex);

                    const maxGameIdx = state.records.reduce((max, r) => Math.max(max, r.gameIndex || 0), 0);
                    if (maxGameIdx >= state.gameCount) {
                        state.gameCount = maxGameIdx + 1;
                        localStorage.setItem('mtg_gameCount', state.gameCount);
                    }

                    localStorage.setItem('mtg_records', JSON.stringify(state.records));
                    updateRecordsTable();
                    alert(`對戰紀錄匯入成功！共新增 ${addedCount} 筆對戰歷史。`);
                }
            } catch (err) {
                alert("檔案格式錯誤，匯入失敗。");
            }
            event.target.value = '';
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>
