<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法風雲會 - 決戰計血器</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(15, 12, 25, 0.75);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8a6d1b;
            --crimson: #a91b1b;
            --crimson-glow: #ff4d4d;
            --border-style: 1px solid var(--gold-primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background: #0d0b14 url('https://cdn.cardsrealm.com/images/cartas/atdm-tarkir-dragonstom-art-series/EN/med/elspeth-storm-slayer-art-series-49.png?3317') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .overlay {
            background: var(--bg-overlay);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 8, 15, 0.9);
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #14101d;
            border-left: 2px solid var(--gold-primary);
            box-shadow: -5px 0 25px rgba(0,0,0,0.8);
            transition: right 0.3s ease;
            z-index: 500;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-drawer.active { right: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
            color: var(--gold-primary);
        }

        .menu-item {
            padding: 12px 15px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold-dark);
            color: #fff;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .menu-item:hover { background: rgba(212, 175, 55, 0.2); }

        .menu-item.active {
            background: rgba(138, 109, 27, 0.85);
            border: 1px solid var(--gold-light);
            color: #fff;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .btn-magic {
            background: linear-gradient(180deg, var(--gold-primary), var(--gold-dark));
            color: #0f0c19;
            border: 1px solid var(--gold-light);
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        .btn-static {
            background: linear-gradient(180deg, var(--gold-primary), var(--gold-dark)) !important;
            color: #0f0c19 !important;
            filter: none !important;
            transform: none !important;
            cursor: pointer;
        }

        .btn-magic:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .btn-round-home {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a1f3d 0%, #110b1a 100%);
            border: 2px solid var(--gold-primary);
            color: var(--gold-light);
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(212, 175, 55, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .view {
            display: none;
            flex: 1;
            padding: 10px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #home-view { gap: 25px; }

        .home-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold-primary);
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            margin-bottom: 10px;
        }

        #game-view {
            padding: 40px 10px 80px 10px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            border-radius: 0;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: none;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 30%, rgba(138, 27, 27, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(75, 18, 110, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(20, 10, 35, 0.6) 0%, transparent 60%),
                linear-gradient(180deg, #07050a 0%, #150a18 50%, #08030b 100%);
        }

        .ember-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffaa33, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 150px, #ff4400, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 80px, #ffdd66, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 400px 220px, #ff3300, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 900px 400px;
            animation: embersMove 12s linear infinite, pulseGlow 4s ease-in-out infinite alternate;
            opacity: 0.7;
        }

        @keyframes embersMove {
            0% { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
            100% { background-position: -100px -400px, 100px -400px, -50px -400px, 80px -400px; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* 網格與卡片排版設定 (支援 2-6 人對坐與寬版長方形) */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            width: 100%;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .game-grid.layout-large { grid-template-columns: 1fr; }

        .player-card-wrapper {
            perspective: 1000px;
            -webkit-perspective: 1000px;
            min-height: 155px; /* 四人時加寬成好閱讀的長方形尺寸 */
            width: 100%;
            will-change: transform;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* 左側欄位：統一往右旋轉 90 度 */
        .game-grid .player-card-wrapper:nth-child(odd) {
            transform: rotate(90deg);
        }

        /* 右側欄位：統一往左旋轉 90 度 */
        .game-grid .player-card-wrapper:nth-child(even) {
            transform: rotate(-90deg);
        }

        /* 單欄模式下的旋轉處理 */
        .game-grid.layout-large .player-card-wrapper:nth-child(1) {
            transform: rotate(180deg);
        }
        .game-grid.layout-large .player-card-wrapper:nth-child(n+2) {
            transform: rotate(0deg);
        }

        .player-card {
            width: 100%; 
            height: 100%;
            min-height: 155px;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .player-card.flipped { 
            transform: rotateY(180deg); 
            -webkit-transform: rotateY(180deg); 
        }

        .card-front, .card-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            border: 1px solid var(--gold-primary) !important;
            outline: 1px solid rgba(212, 175, 55, 0.25);
            outline-offset: -4px;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 -40px 60px rgba(0, 0, 0, 0.85), 0 10px 30px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
            transition: filter 0.3s ease;
        }

        .card-front {
            z-index: 2;
            transform: rotateY(0deg);
            -webkit-transform: rotateY(0deg);
        }

        .card-back {
            z-index: 1;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            padding: 8px 10px;
        }

        .card-front::before, .card-back::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(15, 12, 25, 0.4) 0%, rgba(10, 8, 15, 0.85) 100%);
            z-index: 1;
        }

        .card-front > *, .card-back > * {
            position: relative;
            z-index: 2;
        }

        .player-card.immunity-active .card-front,
        .player-card.immunity-active .card-back {
            border-color: #ffd700 !important;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.6) !important;
        }

        .icon-btn-immunity {
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.35;
            filter: grayscale(1);
            transition: all 0.2s ease;
            line-height: 1;
        }

        .icon-btn-immunity.active {
            opacity: 1;
            filter: drop-shadow(0 0 8px #ffd700);
            transform: scale(1.1);
        }

        .action-icon-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 2px;
        }

        .player-card.eliminated .card-front,
        .player-card.eliminated .card-back {
            filter: grayscale(100%) brightness(0.22);
        }

        .skull-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .player-card.eliminated .skull-overlay {
            display: flex;
        }

        .skull-svg {
            width: 140px;
            height: 140px;
            animation: magicSummon 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes magicSummon {
            0% { transform: scale(0.1) rotate(-45deg); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        }

        .skull-eye-fire {
            animation: eyePulsate 1.8s ease-in-out infinite alternate;
        }

        @keyframes eyePulsate {
            0% { opacity: 0.6; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .card-back-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            gap: 4px;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            cursor: pointer;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .monarch-crown {
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.2s;
            line-height: 1;
        }

        .monarch-crown.active {
            opacity: 1;
            filter: drop-shadow(0 0 6px #ffd700);
        }

        .life-display {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            text-shadow: 0 3px 6px rgba(0, 0, 0, 1), 0 0 15px rgba(212, 175, 55, 0.6);
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.15s ease;
        }

        .life-display.danger {
            color: var(--crimson-glow);
            text-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
        }

        .life-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-life {
            flex: 1;
            padding: 4px 0;
            font-size: 1rem;
            font-weight: bold;
            background: rgba(10, 8, 15, 0.75) !important;
            border: 1px solid var(--gold-primary) !important;
            color: var(--gold-light);
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
            transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-life-large {
            padding: 6px 0;
            font-size: 1.2rem;
        }

        .btn-status-ctrl {
            padding: 4px 0;
            font-size: 0.9rem;
            border-radius: 4px;
        }

        .btn-life:active {
            transform: scale(0.92) !important;
            background: var(--gold-primary) !important;
            color: #100b18 !important;
            box-shadow: 0 0 15px var(--gold-primary) !important;
        }

        .status-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .status-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badges {
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
            justify-content: center;
            cursor: pointer;
            min-height: 16px;
        }

        .badge {
            background: rgba(42, 31, 61, 0.85);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
        }

        .badge.warning-glow {
            background: rgba(90, 0, 0, 0.85);
            border-color: #ff4d4d;
            color: #ff9999;
            box-shadow: 0 0 8px #ff0000;
        }

        /* 移除反面翻面箭頭的下方方框 */
        .btn-flip-back {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--gold-light);
            padding: 2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-flip-back svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .floating-controls {
            position: fixed;
            bottom: 20px; right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn-icon-styled {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a2b54, #0d0814) !important;
            border: 1.5px solid var(--gold-primary) !important;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9), 0 0 12px rgba(212, 175, 55, 0.3) !important;
            transition: all 0.2s ease;
        }

        .btn-icon-styled:active {
            transform: scale(0.9);
        }

        .btn-icon-styled svg { width: 24px; height: 24px; fill: currentColor; }

        .modal-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-mask.active { display: flex; }

        .modal-content {
            background: rgba(24, 20, 36, 0.95);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 20px;
            width: 95%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .modal-close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            color: var(--gold-primary);
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 8px;
        }

        .cmd-damage-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .cmd-damage-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--gold-dark);
            gap: 10px;
        }

        .cmd-damage-player {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .cmd-damage-player-name {
            color: var(--gold-light);
            font-weight: bold;
            word-break: break-word;
            white-space: normal;
        }

        .cmd-damage-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--gold-primary);
            object-fit: cover;
            flex-shrink: 0;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; color: var(--gold-light); font-size: 0.9rem; }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #0a080f;
            border: 1px solid var(--gold-dark);
            color: #fff;
            border-radius: 4px;
            font-size: 0.9rem;
            -webkit-user-select: text;
            user-select: text;
        }

        .player-setup-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .player-setup-row {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); padding: 10px;
            border-radius: 6px; border: 1px solid #332a45; width: 100%;
        }
        .team-label { color: var(--gold-primary); font-size: 0.9rem; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
        .avatar-preview { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--gold-primary); object-fit: cover; cursor: pointer; flex-shrink: 0; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .avatar-option { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; object-fit: cover; cursor: pointer; }

        .records-table-container {
            max-height: 420px; overflow-y: auto;
            border: 1px solid #2a2038; border-radius: 8px;
            margin-top: 15px; background: rgba(10, 8, 15, 0.8);
        }

        .records-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .records-table th, .records-table td { padding: 10px; text-align: center; border-bottom: 1px solid #2a2038; }
        .records-table th { position: sticky; top: 0; background: rgba(212, 175, 55, 0.9); color: #000; font-weight: bold; z-index: 10; }
        .win-tag { color: #ffd700; font-weight: bold; }

        .stats-summary { margin-top: 15px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; width: 100%; font-size: 0.9rem; }
        .stats-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .stats-item { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(10, 8, 15, 0.6); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 4px; }
        .winner-checkbox-group { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; text-align: left; }
        .winner-checkbox-item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 4px; cursor: pointer; }

        .dice-rolling { font-size: 3rem; color: var(--gold-primary); text-shadow: 0 0 15px rgba(212, 175, 55, 0.8); animation: pulse-dice 0.15s infinite alternate; }
        @keyframes pulse-dice { from { transform: scale(0.95); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

<div class="overlay">
    <nav class="navbar">
        <div class="brand">⚔️ MTG Life Counter</div>
        <button class="hamburger-btn" onclick="toggleMenu()" aria-label="切換選單">☰</button>
    </nav>

    <div class="menu-drawer" id="menuDrawer">
        <div class="menu-header">
            <h3>選單 MENU</h3>
            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="關閉選單">✕</button>
        </div>
        <button class="menu-item active" id="menu-home-view" onclick="navTo('home-view')">🏠 首頁</button>
        <button class="menu-item" id="menu-game-view" onclick="navTo('game-view')">⚔️ 比賽場</button>
        <button class="menu-item" id="menu-records-view" onclick="navTo('records-view')">📜 對戰紀錄</button>
    </div>

    <!-- 首頁視圖 -->
    <div id="home-view" class="view active">
        <h1 class="home-title">MAGIC THE GATHERING<br><span style="font-size: 1.3rem; color: #fff;">決戰計血器</span></h1>
        
        <div id="home-buttons" style="display: flex; flex-direction: row; gap: 20px; align-items: center; justify-content: center;">
            <button class="btn-round-home" id="btn-continue" style="display:none;" onclick="navTo('game-view')">
                <svg style="width:28px;height:28px;fill:currentColor;" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>繼續遊戲</span>
            </button>
            <button class="btn-round-home" onclick="openNewGameModal()">
                <svg style="width:28px;height:28px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>開新局</span>
            </button>
        </div>
    </div>

    <!-- 比賽場視圖 -->
    <div id="game-view" class="view">
        <div class="ember-layer"></div>
        <div class="game-grid" id="gameGrid"></div>

        <div class="floating-controls" id="floatingControls" style="display: none;">
            <button class="btn-icon-styled" onclick="rollD20All()" title="一鍵擲D20" aria-label="一鍵擲D20">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l3.5 12L12 22l6.5-3L22 7L12 2zm0 2.8L18.2 8H5.8L12 4.8zM4.5 9.5h15l-3.3 3.5L12 10.8l-4.2 2.2L4.5 9.5zM12 13.2l3.8 2-3.8 4.5-3.8-4.5 3.8-2zM6.2 14.2l3.8 2-4.1 2.2L4 13.2l2.2 1zM17.8 14.2l2.2-1-1.9 5.2-4.1-2.2 3.8-2z"/></svg>
            </button>
            <button class="btn-icon-styled" onclick="openResetModal()" title="重置本局" aria-label="重置本局">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
    </div>

    <!-- 紀錄視圖 -->
    <div id="records-view" class="view">
        <h2 style="color: var(--gold-primary); margin-bottom: 15px;">對戰歷史紀錄</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn-magic btn-static" onclick="exportRecords()">匯出紀錄</button>
            <button class="btn-magic btn-static" onclick="document.getElementById('importFile').click()">匯入紀錄</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importRecords(event)">
        </div>

        <div class="records-table-container">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>局數</th>
                        <th>姓名/隊伍</th>
                        <th>戰績</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody"></tbody>
            </table>
        </div>

        <div class="stats-summary">
            <h3 style="color: var(--gold-primary); margin-bottom: 10px;">個人總勝負統計</h3>
            <div id="statsSummaryContent" class="stats-list"></div>
        </div>
    </div>
</div>

<!-- Modal 區塊 -->
<div class="modal-mask" id="newGameModal">
    <div class="modal-content">
        <div class="modal-title">開新局設定</div>
        <div class="form-group">
            <label for="modeSelect">模式 (必填)</label>
            <select id="modeSelect" onchange="updateSetupForm()">
                <option value="Commander">指揮官</option>
                <option value="TwoHeadedGiant">雙頭巨人</option>
                <option value="Kingdoms">三國殺</option>
            </select>
        </div>
        <div class="form-group">
            <label for="playerCountSelect">人數 (必填)</label>
            <select id="playerCountSelect" onchange="updatePlayerRows()"></select>
        </div>

        <div style="margin-top: 15px;">
            <label style="color: var(--gold-light);">玩家設定</label>
            <div class="player-setup-list" id="playerSetupList"></div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-magic" id="btnStartGame" style="flex:1;" disabled onclick="startGame()">準備好了！開始對戰</button>
            <button class="btn-magic" style="background: #444;" onclick="closeModal('newGameModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="avatarModal">
    <div class="modal-content">
        <div class="modal-title">選擇鵬洛客頭像</div>
        <div class="avatar-grid" id="avatarGrid"></div>
        <button class="btn-magic" style="margin-top: 15px; width: 100%;" onclick="closeModal('avatarModal')">關閉</button>
    </div>
</div>

<div class="modal-mask" id="cmdDamageModal">
    <div class="modal-content">
        <button class="modal-close-x" onclick="closeModal('cmdDamageModal')" aria-label="關閉">✕</button>
        <div class="modal-title" id="cmdModalTitle">⚔️ 受到的指揮官傷害</div>
        <div class="cmd-damage-list" id="cmdDamageList"></div>
    </div>
</div>

<div class="modal-mask" id="resetModal">
    <div class="modal-content" style="text-align: center;">
        <div class="modal-title">重置對戰與勝負結算</div>
        <p style="color: #ccc; font-size:0.9rem;">請勾選本局獲勝的個人或隊伍：</p>
        
        <div class="winner-checkbox-group" id="winnerSelectorList"></div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 20px;">
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('same')">目前模式</button>
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('new')">新模式</button>
        </div>
        <button class="btn-magic" style="width: 100%; background: #444;" onclick="closeModal('resetModal')">取消</button>
    </div>
</div>

<div class="modal-mask" id="diceModal">
    <div class="modal-content" style="text-align: center;">
        <button class="modal-close-x" id="btnDiceClose" onclick="closeModal('diceModal')" aria-label="關閉">✕</button>
        <div class="modal-title" id="diceWinnerTitle">🎲 擲骰進行中...</div>
        <div id="diceResults" style="font-size: 1.05rem; line-height: 1.8; text-align: left; margin-top: 10px; min-height: 120px;"></div>
    </div>
</div>

<script>
    const PLANESWALKERS = [
        { name: "Rowan Kenrith", url: "https://images.ctfassets.net/s5n2t79q9icq/1sqcHwy3RJKGZ2BT5B8xsi/27e26027ca67551f68860f89051c7cdc/rowan-kenrith-300.jpg" },
        { name: "The Wanderer", url: "https://images.ctfassets.net/s5n2t79q9icq/3xwuZfGjME99g4m8UV8Tkx/673c5305e0216b992ad020cd7bf85b47/the-wanderer-300.jpg" },
        { name: "Basri Khet", url: "https://images.ctfassets.net/s5n2t79q9icq/1q2WnoQyMIPY5JeS47evum/a107915c16efa6ebf586047cc1c409c8/basri-khet-300.jpg" },
        { name: "Elspeth Tirel", url: "https://images.ctfassets.net/s5n2t79q9icq/c0HWQ5xD293WdkqUd3vUN/abe4d649a0ca25a7a260c32377df7094/elspeth-tirel-300.jpg" },
        { name: "Nissa Revane", url: "https://images.ctfassets.net/s5n2t79q9icq/4QQyvTFy433ucZsAukFCy/74498ba02a7ed94bce4a290506253552/nissa-revane-300.jpg" },
        { name: "Ajani", url: "https://images.ctfassets.net/s5n2t79q9icq/6aF1l2DFY0oRxa4Zsmm7PR/87b8393aae247b2d2d9c4274b370a9b4/ajani-300.jpg" },
        { name: "Oko", url: "https://images.ctfassets.net/s5n2t79q9icq/OuYONzWUywVZy13ScRKXO/5a5b83df87b60b4f8d13988db5ed5788/oko-300.jpg" },
        { name: "Serra", url: "https://images.ctfassets.net/s5n2t79q9icq/78Bo4S43kxvjlaGYbcK8JU/070181e909364fe85c9b5d58e8778bfd/serra-300.jpg" },
        { name: "Elspeth Resplendent", url: "https://cdn.cardsrealm.com/images/cartas/asnc-new-capenna-art-series/en/med/elspeth-resplendent-card-3s.png?4261" },
        { name: "Mu Yanling", url: "https://images.ctfassets.net/s5n2t79q9icq/6H7suxzk8ecyTTjvN7TCsO/e117e3b5c38137a45c840f5105d49a1b/mu-yanling-300.jpg" },
        { name: "Liliana Vess", url: "https://images.ctfassets.net/s5n2t79q9icq/7np4TX3O6p4VnJb0RLK65k/2e0509c14819abf6f7a4e14eb0da1db7/liliana-vess-300.jpg" },
        { name: "Lord Windgrace", url: "https://images.ctfassets.net/s5n2t79q9icq/1WGIgsOaexpwNs0BwF8dFI/f11920a282bc60edc5c6415d42b9a1fa/windgrace-300.jpg" }
    ];

    const SKULL_SVG_MARKUP = `
        <svg class="skull-svg" viewBox="0 0 512 512">
            <defs>
                <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.8"/>
                    <stop offset="60%" stop-color="#800000" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="skullMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e63939"/>
                    <stop offset="50%" stop-color="#800a0a"/>
                    <stop offset="100%" stop-color="#2a0000"/>
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="230" fill="url(#magicGlow)" />
            <circle cx="256" cy="256" r="220" fill="none" stroke="#a91b1b" stroke-width="3" stroke-dasharray="12 6" opacity="0.75" />
            <circle cx="256" cy="256" r="200" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5" />
            <path d="M256 36 L272 200 L436 256 L272 312 L256 476 L240 312 L76 256 L240 200 Z" fill="none" stroke="#8a1b1b" stroke-width="2" opacity="0.6" />
            <path d="M256 70c-82.8 0-150 67.2-150 150 0 46.2 20.9 87.5 53.6 115l-18 42c-3.2 7.5 2.3 16 10.4 16h31c5.8 0 11-3.6 13.1-9l12.1-30.2c15.1 7.2 32 11.2 49.8 11.2s34.7-4 49.8-11.2l12.1 30.2c2.1 5.4 7.3 9 13.1 9h31c8.1 0 13.6-8.5 10.4-16l-18-42c32.7-27.5 53.6-68.8 53.6-115 0-82.8-67.2-150-150-150zm-62 130c17.7 0 32 19.2 32 43s-14.3 43-32 43-32-19.2-32-43 14.3-43 32-43zm124 0c17.7 0 32 19.2 32 43s-14.3 43-32 43-32-19.2-32-43 14.3-43 32-43zm-104 150v32h-20v-32h20zm42 0v32h-20v-32h20zm42 0v32h-20v-32h20z" 
                  fill="url(#skullMetallic)" stroke="#ff4d4d" stroke-width="3" />
            <path d="M256 270l-22 30h44z" fill="#0d0b14" />
            <circle class="skull-eye-fire" cx="194" cy="243" r="10" fill="#ff4d4d" filter="drop-shadow(0 0 6px #ff0000)" />
            <circle class="skull-eye-fire" cx="318" cy="243" r="10" fill="#ff4d4d" filter="drop-shadow(0 0 6px #ff0000)" />
        </svg>
    `;

    let state = {
        historyNames: JSON.parse(localStorage.getItem('mtg_historyNames')) || {},
        currentGame: JSON.parse(localStorage.getItem('mtg_currentGame')) || null,
        records: JSON.parse(localStorage.getItem('mtg_records')) || [],
        gameCount: parseInt(localStorage.getItem('mtg_gameCount')) || 1
    };

    let activeSelectingPlayerIndex = null;

    function bindHoldEvent(element, actionFn) {
        if (!element) return;
        let holdTimer = null;
        let holdInterval = null;
        let activePointerId = null;

        const stop = (e) => {
            if (activePointerId !== null && element.releasePointerCapture) {
                try { element.releasePointerCapture(activePointerId); } catch(err){}
                activePointerId = null;
            }
            if (holdTimer) clearTimeout(holdTimer);
            if (holdInterval) clearInterval(holdInterval);
            holdTimer = null;
            holdInterval = null;
        };

        const start = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            stop();

            activePointerId = e.pointerId;
            if (element.setPointerCapture) {
                try { element.setPointerCapture(e.pointerId); } catch(err){}
            }

            actionFn();

            holdTimer = setTimeout(() => {
                let speed = 150;
                const runStep = () => {
                    actionFn();
                    speed = Math.max(60, speed * 0.9);
                    holdInterval = setTimeout(runStep, speed);
                };
                runStep();
            }, 350);
        };

        element.addEventListener('pointerdown', start);
        element.addEventListener('pointerup', stop);
        element.addEventListener('pointercancel', stop);
        element.addEventListener('pointerleave', stop);
    }

    window.onload = function() {
        if (state.currentGame) {
            document.getElementById('btn-continue').style.display = 'flex';
        }
        updateRecordsTable();
    };

    function flipCard(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) cardElem.classList.add('flipped');
    }

    function flipCardFront(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) cardElem.classList.remove('flipped');
    }

    function toggleMenu() {
        document.getElementById('menuDrawer').classList.toggle('active');
    }

    function navTo(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('menuDrawer').classList.remove('active');
        
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
        const activeMenuItem = document.getElementById(`menu-${viewId}`);
        if (activeMenuItem) activeMenuItem.classList.add('active');

        if (viewId === 'game-view') {
            renderGameGrid();
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function openNewGameModal() {
        document.getElementById('newGameModal').classList.add('active');
        updateSetupForm();
    }

    function updateSetupForm() {
        const mode = document.getElementById('modeSelect').value;
        const countSelect = document.getElementById('playerCountSelect');
        const currentCount = countSelect.value;
        countSelect.innerHTML = '';

        if (mode === 'TwoHeadedGiant') {
            [4, 6, 8].forEach(n => countSelect.add(new Option(`${n} 人 (${n/2} 隊)`, n)));
        } else {
            for(let i=2; i<=8; i++) countSelect.add(new Option(`${i} 人`, i));
        }

        if (Array.from(countSelect.options).some(opt => opt.value === currentCount)) {
            countSelect.value = currentCount;
        }

        updatePlayerRows();
    }

    function updatePlayerRows() {
        const mode = document.getElementById('modeSelect').value;
        const count = parseInt(document.getElementById('playerCountSelect').value);
        const container = document.getElementById('playerSetupList');

        const oldInputs = Array.from(container.querySelectorAll('.p-name')).map(i => i.value);
        const oldAvatars = Array.from(container.querySelectorAll('.avatar-preview')).map(img => img.src);

        container.innerHTML = '';
        let rowCount = mode === 'TwoHeadedGiant' ? count / 2 : count;

        for (let i = 0; i < rowCount; i++) {
            const row = document.createElement('div');
            row.className = 'player-setup-row';
            let defaultAvatar = oldAvatars[i] || PLANESWALKERS[i % PLANESWALKERS.length].url;

            if (mode === 'TwoHeadedGiant') {
                let name1 = oldInputs[i * 2] || '';
                let name2 = oldInputs[i * 2 + 1] || '';
                row.innerHTML = `
                    <span class="team-label">隊 ${i+1}:</span>
                    <input type="text" placeholder="隊友 1" class="p-name" value="${name1}" oninput="validateSetupForm()">
                    <input type="text" placeholder="隊友 2" class="p-name" value="${name2}" oninput="validateSetupForm()">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            } else {
                let name = oldInputs[i] || '';
                row.innerHTML = `
                    <input type="text" placeholder="玩家 ${i+1} 姓名" class="p-name" value="${name}" oninput="validateSetupForm()" onchange="autoFillAvatar(this, ${i})">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            }
            container.appendChild(row);
        }

        validateSetupForm();
    }

    function autoFillAvatar(inputElem, index) {
        const val = inputElem.value.trim();
        if (state.historyNames[val]) {
            document.getElementById(`avatar-prev-${index}`).src = state.historyNames[val];
        }
    }

    function validateSetupForm() {
        const inputs = Array.from(document.querySelectorAll('.p-name'));
        const allFilled = inputs.every(input => input.value.trim() !== '');
        document.getElementById('btnStartGame').disabled = !allFilled;
    }

    function openAvatarModal(playerIndex) {
        activeSelectingPlayerIndex = playerIndex;
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = PLANESWALKERS.map(p => `
            <img src="${p.url}" title="${p.name}" class="avatar-option" referrerpolicy="no-referrer" onclick="selectAvatar('${p.url}')">
        `).join('');
        document.getElementById('avatarModal').classList.add('active');
    }

    function selectAvatar(url) {
        const img = document.getElementById(`avatar-prev-${activeSelectingPlayerIndex}`);
        if(img) img.src = url;
        closeModal('avatarModal');
    }

    function startGame() {
        const mode = document.getElementById('modeSelect').value;
        const rows = document.querySelectorAll('.player-setup-row');
        let players = [];
        let defaultLife = mode === 'TwoHeadedGiant' ? 50 : 40;

        rows.forEach((row, idx) => {
            if (mode === 'TwoHeadedGiant') {
                const names = Array.from(row.querySelectorAll('.p-name')).map(i => i.value.trim());
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: `${names[0]} & ${names[1]}`,
                    members: [names[0], names[1]],
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
            } else {
                const name = row.querySelector('.p-name').value.trim();
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: name,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamages: {},
                    isMonarch: false,
                    isImmune: false
                });
                state.historyNames[name] = avatar;
            }
        });

        localStorage.setItem('mtg_historyNames', JSON.stringify(state.historyNames));
        state.currentGame = { mode: mode, players: players };

        saveCurrentGame();
        closeModal('newGameModal');
        navTo('game-view');
    }

    function saveCurrentGame() {
        localStorage.setItem('mtg_currentGame', JSON.stringify(state.currentGame));
        document.getElementById('btn-continue').style.display = 'flex';
    }

    function checkEliminated(p) {
        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(d => { if (d > maxCmdDmg) maxCmdDmg = d; });
        }
        const conditionMet = (p.life <= 0 || p.poison >= 10 || maxCmdDmg >= 21);
        return conditionMet && !p.isImmune;
    }

    function renderGameGrid() {
        const grid = document.getElementById('gameGrid');
        const controls = document.getElementById('floatingControls');
        grid.innerHTML = '';

        if (!state.currentGame || !state.currentGame.players || state.currentGame.players.length === 0) {
            if (controls) controls.style.display = 'none';
            return;
        }

        if (controls) controls.style.display = 'flex';

        const count = state.currentGame.players.length;
        const isLayoutLarge = (count >= 2 && count <= 3);
        const isKingdoms = (state.currentGame.mode === 'Kingdoms');

        if (isLayoutLarge) {
            grid.classList.add('layout-large');
        } else {
            grid.classList.remove('layout-large');
        }

        state.currentGame.players.forEach((p, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'player-card-wrapper';

            const isEliminated = checkEliminated(p);

            cardWrapper.innerHTML = `
                <div class="player-card ${isEliminated ? 'eliminated' : ''} ${p.isImmune ? 'immunity-active' : ''}" id="card-${index}">
                    <div class="skull-overlay">${SKULL_SVG_MARKUP}</div>

                    <!-- 卡牌正面 -->
                    <div class="card-front" style="background-image: url('${p.avatar}');" onclick="flipCard(${index})">
                        <div class="card-header">
                            <div class="player-info">
                                <div class="card-name">${p.name}</div>
                            </div>
                            <div class="action-icon-column">
                                ${isKingdoms ? `
                                    <div class="monarch-crown ${p.isMonarch ? 'active' : ''}" onclick="event.stopPropagation(); toggleMonarch(${index})" title="指定主公">👑</div>
                                ` : ''}
                                <div class="icon-btn-immunity ${p.isImmune ? 'active' : ''}" onclick="event.stopPropagation(); toggleImmunity(${index})" title="切換不死之身">🛡️</div>
                            </div>
                        </div>
                        <div class="life-display ${p.life <= 10 ? 'danger' : ''}" id="life-val-${index}">${p.life}</div>
                        
                        <div class="status-badges" id="status-badges-${index}"></div>

                        <div class="life-controls" onclick="event.stopPropagation()">
                            <button class="btn-life btn-life-large btn-minus">-1</button>
                            <button class="btn-life btn-life-large btn-plus">+1</button>
                        </div>
                    </div>

                    <!-- 卡牌背面 -->
                    <div class="card-back" style="background-image: url('${p.avatar}');">
                        <div class="card-back-body">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:bold; color:var(--gold-light); font-size:0.9rem;">${p.name}</span>
                                <button class="btn-flip-back" onclick="event.stopPropagation(); flipCardFront(${index})" title="翻回正面" aria-label="翻回正面">
                                    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                                </button>
                            </div>

                            <!-- 中毒標記 -->
                            <div class="status-row">
                                <div class="status-title">🧪 中毒標記</div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn-life btn-status-ctrl btn-poison-minus">-1</button>
                                    <button class="btn-life btn-status-ctrl btn-poison-plus">+1</button>
                                </div>
                            </div>

                            <!-- 指揮官傷害 -->
                            <div class="status-row">
                                <div class="status-title">⚔️ 指揮官傷害</div>
                                <button class="btn-magic" id="cmd-btn-${index}" style="width:100%; padding: 6px 4px; font-size:0.82rem; line-height: 1.2; margin-top:2px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" onclick="event.stopPropagation(); openCmdDamageModal(${index})">
                                    傷害列表
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            bindHoldEvent(cardWrapper.querySelector('.btn-minus'), () => changeLife(index, -1));
            bindHoldEvent(cardWrapper.querySelector('.btn-plus'), () => changeLife(index, 1));
            bindHoldEvent(cardWrapper.querySelector('.btn-poison-minus'), () => changeStatus(index, 'poison', -1));
            bindHoldEvent(cardWrapper.querySelector('.btn-poison-plus'), () => changeStatus(index, 'poison', 1));

            grid.appendChild(cardWrapper);
            updateCardBadgesUI(index);
        });
    }

    function toggleImmunity(index) {
        const p = state.currentGame.players[index];
        p.isImmune = !p.isImmune;
        saveCurrentGame();
        renderGameGrid();
    }

    function updateCardBadgesUI(index) {
        const p = state.currentGame.players[index];
        const badgesContainer = document.getElementById(`status-badges-${index}`);
        const cmdBtn = document.getElementById(`cmd-btn-${index}`);
        const cardElem = document.getElementById(`card-${index}`);

        if (!badgesContainer) return;

        let maxCmdDmg = 0;
        if (p.cmdDamages) {
            Object.values(p.cmdDamages).forEach(dmg => {
                if (dmg > maxCmdDmg) maxCmdDmg = dmg;
            });
        }

        badgesContainer.innerHTML = `
            ${p.poison > 0 ? `<span class="badge ${p.poison >= 8 ? 'warning-glow' : ''}">🧪 毒:${p.poison}</span>` : ''}
            ${maxCmdDmg > 0 ? `
                <span class="badge ${maxCmdDmg >= 15 ? 'warning-glow' : ''}" onclick="event.stopPropagation(); openCmdDamageModal(${index})">
                    ⚔️ 傷:${maxCmdDmg}
                </span>
            ` : ''}
        `;

        if (cmdBtn) {
            cmdBtn.innerText = `傷害列表 (最高: ${maxCmdDmg})`;
        }

        if (cardElem) {
            const isEliminated = checkEliminated(p);
            if (isEliminated) {
                cardElem.classList.add('eliminated');
            } else {
                cardElem.classList.remove('eliminated');
            }
        }
    }

    function changeLife(index, delta) {
        let p = state.currentGame.players[index];
        p.life += delta;
        saveCurrentGame();

        const lifeDisplay = document.getElementById(`life-val-${index}`);
        if (lifeDisplay) {
            lifeDisplay.innerText = p.life;
            if (p.life <= 10) {
                lifeDisplay.classList.add('danger');
            } else {
                lifeDisplay.classList.remove('danger');
            }
        }
        updateCardBadgesUI(index);
    }

    function changeStatus(index, type, delta) {
        let p = state.currentGame.players[index];
        p[type] = Math.max(0, (p[type] || 0) + delta);
        saveCurrentGame();
        updateCardBadgesUI(index);
    }

    function openCmdDamageModal(victimIndex) {
        const victim = state.currentGame.players[victimIndex];
        const is2HG = state.currentGame.mode === 'TwoHeadedGiant';
        
        document.getElementById('cmdModalTitle').innerText = `⚔️ 受到的指揮官傷害`;
        
        const listContainer = document.getElementById('cmdDamageList');
        listContainer.innerHTML = '';

        if (!victim.cmdDamages) victim.cmdDamages = {};

        state.currentGame.players.forEach((attacker, attackerIdx) => {
            if (attackerIdx === victimIndex) return;

            let attackerList = [];
            if (is2HG && attacker.members && attacker.members.length > 0) {
                attackerList = attacker.members.map(m => ({ name: m, avatar: attacker.avatar }));
            } else {
                attackerList = [{ name: attacker.name, avatar: attacker.avatar }];
            }

            attackerList.forEach(atk => {
                const currentDmg = victim.cmdDamages[atk.name] || 0;

                const row = document.createElement('div');
                row.className = 'cmd-damage-item';
                row.innerHTML = `
                    <div class="cmd-damage-player">
                        <img src="${atk.avatar}" class="cmd-damage-avatar" referrerpolicy="no-referrer">
                        <span class="cmd-damage-player-name">${atk.name}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                        <span id="cmd-val-${victimIndex}-${atk.name}" style="font-size: 1.1rem; font-weight: bold; color: ${currentDmg >= 15 ? 'var(--crimson-glow)' : 'var(--gold-primary)'}">
                            ${currentDmg} / 21
                        </span>
                        <div style="display: flex; gap: 4px;">
                            <button class="btn-life btn-status-ctrl btn-cmd-minus" style="width:36px;">-1</button>
                            <button class="btn-life btn-status-ctrl btn-cmd-plus" style="width:36px;">+1</button>
                        </div>
                    </div>
                `;

                bindHoldEvent(row.querySelector('.btn-cmd-minus'), () => changeCmdDamageDetail(victimIndex, atk.name, -1));
                bindHoldEvent(row.querySelector('.btn-cmd-plus'), () => changeCmdDamageDetail(victimIndex, atk.name, 1));

                listContainer.appendChild(row);
            });
        });

        document.getElementById('cmdDamageModal').classList.add('active');
    }

    function changeCmdDamageDetail(victimIndex, attackerName, delta) {
        const victim = state.currentGame.players[victimIndex];
        if (!victim.cmdDamages) victim.cmdDamages = {};
        
        let current = victim.cmdDamages[attackerName] || 0;
        let updated = Math.max(0, current + delta);
        victim.cmdDamages[attackerName] = updated;

        saveCurrentGame();
        
        const valElem = document.getElementById(`cmd-val-${victimIndex}-${attackerName}`);
        if (valElem) {
            valElem.innerText = `${updated} / 21`;
            valElem.style.color = updated >= 15 ? 'var(--crimson-glow)' : 'var(--gold-primary)';
        }

        updateCardBadgesUI(victimIndex);
    }

    function toggleMonarch(index) {
        state.currentGame.players.forEach((p, i) => {
            if (i === index) {
                p.isMonarch = !p.isMonarch;
                p.life = p.isMonarch ? 50 : 40;
            } else {
                p.isMonarch = false;
            }
        });
        saveCurrentGame();
        renderGameGrid();
    }

    function rollD20All() {
        const results = document.getElementById('diceResults');
        const titleElem = document.getElementById('diceWinnerTitle');
        const closeBtn = document.getElementById('btnDiceClose');

        titleElem.innerHTML = `🎲 擲骰進行中...`;
        closeBtn.style.display = 'none';
        document.getElementById('diceModal').classList.add('active');

        let contenders = state.currentGame.players.map(p => ({ name: p.name }));
        let roundLogs = [];
        let round = 1;
        let finalWinner = "";

        while (contenders.length > 1) {
            let log = { round: round, rolls: [], isTie: false };
            let maxRoll = -1;
            let currentWinners = [];

            contenders.forEach(c => {
                const roll = Math.floor(Math.random() * 20) + 1;
                log.rolls.push({ name: c.name, roll: roll });
                if (roll > maxRoll) {
                    maxRoll = roll;
                    currentWinners = [{ name: c.name, roll: roll }];
                } else if (roll === maxRoll) {
                    currentWinners.push({ name: c.name, roll: roll });
                }
            });

            if (currentWinners.length === 1) {
                finalWinner = currentWinners[0].name;
                roundLogs.push(log);
                break;
            } else {
                log.isTie = true;
                roundLogs.push(log);
                contenders = currentWinners;
                round++;
            }
        }

        let startTime = Date.now();
        let animInterval = setInterval(() => {
            let elapsedTime = Date.now() - startTime;
            if (elapsedTime < 1000) {
                let randomRolls = state.currentGame.players.map(p => 
                    `<div><strong>${p.name}</strong> 🎲 <span class="dice-rolling">${Math.floor(Math.random() * 20) + 1}</span></div>`
                ).join('');
                results.innerHTML = `<div style="text-align:center;">${randomRolls}</div>`;
            } else {
                clearInterval(animInterval);
                titleElem.innerHTML = `🎲 最終勝者：<span style="color:#ffd700">${finalWinner}</span>！`;
                closeBtn.style.display = 'block';

                let finalHtml = '';
                roundLogs.forEach(log => {
                    if (log.round > 1) {
                        finalHtml += `<div style="color:var(--gold-primary); margin-top:8px; font-weight:bold; border-top:1px dashed #444; padding-top:4px;">⚠️ 出現最高平手！進行第 ${log.round} 輪同分重擲：</div>`;
                    }
                    log.rolls.forEach(r => {
                        finalHtml += `<div><strong>${r.name}</strong> 擲出 🎲 <span style="color:var(--gold-primary); font-size:1.2rem; font-weight:bold;">${r.roll}</span> 點</div>`;
                    });
                });
                results.innerHTML = finalHtml;
            }
        }, 80);
    }

    function openResetModal() {
        if (!state.currentGame) return;
        const list = document.getElementById('winnerSelectorList');
        list.innerHTML = '';

        state.currentGame.players.forEach((p, idx) => {
            list.innerHTML += `
                <label class="winner-checkbox-item">
                    <input type="checkbox" class="winner-checkbox" value="${idx}">
                    <span>👑 ${p.name} (剩餘血量: ${p.life})</span>
                </label>
            `;
        });

        document.getElementById('resetModal').classList.add('active');
    }

    function confirmReset(type) {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        let winnersIndices = [];
        checkboxes.forEach(cb => {
            if (cb.checked) winnersIndices.push(parseInt(cb.value));
        });

        recordGameResult(winnersIndices);
        closeModal('resetModal');

        if (type === 'same') {
            let defaultLife = state.currentGame.mode === 'TwoHeadedGiant' ? 50 : 40;
            state.currentGame.players.forEach(p => {
                p.life = p.isMonarch ? 50 : defaultLife;
                p.poison = 0;
                p.cmdDamages = {};
                p.isImmune = false;
            });
            saveCurrentGame();
            renderGameGrid();
        } else {
            openNewGameModal();
        }
    }

    function recordGameResult(winnersIndices) {
        if (!state.currentGame) return;

        let dateStr = new Date().toLocaleDateString();

        state.currentGame.players.forEach((p, idx) => {
            let isWin = winnersIndices.includes(idx);
            state.records.push({
                date: dateStr,
                gameIndex: state.gameCount,
                name: p.name,
                result: isWin ? 'WIN' : 'LOSE'
            });
        });

        state.gameCount++;
        localStorage.setItem('mtg_records', JSON.stringify(state.records));
        localStorage.setItem('mtg_gameCount', state.gameCount);
        updateRecordsTable();
    }

    function updateRecordsTable() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        state.records.slice().reverse().forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.date}</td>
                    <td>第 ${r.gameIndex} 局</td>
                    <td>${r.name}</td>
                    <td>${r.result === 'WIN' ? '<span class="win-tag">👑 贏</span>' : '輸'}</td>
                </tr>
            `;
        });

        const statsMap = {};
        state.records.forEach((r, recordIndex) => {
            const individualNames = r.name.split('&').map(s => s.trim());
            individualNames.forEach(name => {
                if (!statsMap[name]) {
                    statsMap[name] = { 
                        name: name, 
                        win: 0, 
                        lose: 0, 
                        firstReachedIndex: recordIndex
                    };
                }
                if (r.result === 'WIN') statsMap[name].win++;
                else statsMap[name].lose++;
            });
        });

        const statsArray = Object.values(statsMap).map(s => {
            const total = s.win + s.lose;
            const rate = total > 0 ? (s.win / total) : 0;
            return { ...s, total, rate };
        });

        statsArray.sort((a, b) => {
            if (b.rate !== a.rate) {
                return b.rate - a.rate;
            }
            return a.firstReachedIndex - b.firstReachedIndex;
        });

        const summaryElem = document.getElementById('statsSummaryContent');
        if (statsArray.length === 0) {
            summaryElem.innerHTML = `<div style="color:#aaa;">尚無統計數據</div>`;
        } else {
            summaryElem.innerHTML = statsArray.map(s => `
                <div class="stats-item">
                    <span><strong>${s.name}</strong></span>
                    <span>${s.win}勝 / ${s.lose}敗 <span style="color:var(--gold-primary); margin-left:8px;">(勝率: ${Math.round(s.rate * 100)}%)</span></span>
                </div>
            `).join('');
        }
    }

    function exportRecords() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.records, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mtg_records_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
    }

    function importRecords(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    let addedCount = 0;
                    importedData.forEach(importedRec => {
                        const isDuplicate = state.records.some(existingRec => 
                            existingRec.date === importedRec.date &&
                            existingRec.gameIndex === importedRec.gameIndex &&
                            existingRec.name === importedRec.name &&
                            existingRec.result === importedRec.result
                        );

                        if (!isDuplicate) {
                            state.records.push(importedRec);
                            addedCount++;
                        }
                    });

                    state.records.sort((a, b) => a.gameIndex - b.gameIndex);

                    const maxGameIdx = state.records.reduce((max, r) => Math.max(max, r.gameIndex || 0), 0);
                    if (maxGameIdx >= state.gameCount) {
                        state.gameCount = maxGameIdx + 1;
                        localStorage.setItem('mtg_gameCount', state.gameCount);
                    }

                    localStorage.setItem('mtg_records', JSON.stringify(state.records));
                    updateRecordsTable();
                    alert(`對戰紀錄匯入成功！共新增 ${addedCount} 筆對戰歷史。`);
                }
            } catch (err) {
                alert("檔案格式錯誤，匯入失敗。");
            }
            event.target.value = '';
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>

</html>
