<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法風雲會 - 決戰計血器</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(15, 12, 25, 0.85);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8a6d1b;
            --crimson: #a91b1b;
            --crimson-glow: #ff4d4d;
            --card-bg: linear-gradient(145deg, rgba(31, 27, 44, 0.95), rgba(18, 15, 26, 0.95));
            --border-style: 2px solid var(--gold-primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background: #0d0b14 url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ30h4EJtyO5d6LgZaRL0Mj9yT3ST-adc7nHXOmOAgUQ&s=10') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .overlay {
            background: var(--bg-overlay);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 8, 15, 0.9);
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #14101d;
            border-left: 2px solid var(--gold-primary);
            box-shadow: -5px 0 25px rgba(0,0,0,0.8);
            transition: right 0.3s ease;
            z-index: 500;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-drawer.active { right: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
            color: var(--gold-primary);
        }

        .menu-item {
            padding: 12px 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-dark);
            color: #fff;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .btn-magic {
            background: linear-gradient(180deg, var(--gold-primary), var(--gold-dark));
            color: #0f0c19;
            border: 1px solid var(--gold-light);
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        .btn-magic:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .btn-magic:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .view {
            display: none;
            flex: 1;
            padding: 10px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #home-view { gap: 20px; }

        .home-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold-primary);
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        #game-view {
            padding: 5px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 雙欄網格 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 60px;
        }

        /* 2~3人單欄橫長版面 */
        .game-grid.layout-large {
            grid-template-columns: 1fr;
        }

        .player-card-wrapper {
            perspective: 1000px;
            min-height: 180px;
        }

        .player-card {
            width: 100%; 
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), filter 0.3s;
        }

        .player-card.flipped { transform: rotateY(180deg); }

        .player-card.dead {
            filter: grayscale(0.9) brightness(0.35);
            opacity: 0.7;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-back {
            transform: rotateY(180deg);
            background: rgba(21, 16, 31, 0.95);
            cursor: pointer;
            justify-content: center;
            padding: 12px;
        }

        .card-back-body {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        .card-back-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-primary);
            object-fit: cover;
        }

        .card-name {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .monarch-crown {
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.2s;
        }

        .monarch-crown.active {
            opacity: 1;
            filter: drop-shadow(0 0 6px #ffd700);
        }

        .life-display {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212,175,55,0.3);
            margin: 0;
            line-height: 1;
            cursor: pointer;
        }

        .life-display.danger {
            color: var(--crimson-glow);
            text-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
        }

        .life-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-life {
            flex: 1;
            padding: 4px 0;
            font-size: 1rem;
            font-weight: bold;
            background: rgba(212,175,55,0.15);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-life-large {
            padding: 8px 0;
            font-size: 1.4rem;
        }

        /* 背面專屬拉長按鈕 */
        .btn-status-large {
            padding: 12px 0;
            font-size: 1.3rem;
            border-radius: 6px;
        }

        .btn-life:active {
            background: var(--gold-primary);
            color: #000;
        }

        .status-badges {
            display: flex;
            gap: 4px;
            font-size: 0.7rem;
            justify-content: center;
            cursor: pointer;
            min-height: 16px;
        }

        .badge {
            background: #2a1f3d;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            transition: all 0.2s;
        }

        .badge.warning-glow {
            background: #5a0000;
            border-color: #ff4d4d;
            color: #ff9999;
            box-shadow: 0 0 8px #ff0000;
            animation: pulse-red 1.2s infinite alternate;
        }

        @keyframes pulse-red {
            from { box-shadow: 0 0 4px #ff0000; }
            to { box-shadow: 0 0 12px #ff4d4d; }
        }

        .floating-controls {
            position: fixed;
            bottom: 15px; right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-round {
            width: 50px; height: 50px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .modal-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .modal-mask.active { display: flex; }

        .modal-content {
            background: #181424;
            border: var(--border-style);
            border-radius: 8px;
            padding: 20px;
            width: 95%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .modal-close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            color: var(--gold-primary);
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 8px;
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--gold-light);
            font-size: 0.9rem;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #0a080f;
            border: 1px solid var(--gold-dark);
            color: #fff;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .player-setup-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .player-setup-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #332a45;
            width: 100%;
        }

        .team-label {
            color: var(--gold-primary);
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .avatar-preview {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-primary);
            object-fit: cover;
            cursor: pointer;
            flex-shrink: 0;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .avatar-option {
            width: 100%; aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid transparent;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: var(--gold-primary);
        }

        .records-table-container {
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #2a2038;
            border-radius: 8px;
            margin-top: 15px;
            background: rgba(10, 8, 15, 0.8);
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .records-table th, .records-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #2a2038;
        }

        .records-table th {
            position: sticky;
            top: 0;
            background: rgba(212, 175, 55, 0.9);
            color: #000;
            font-weight: bold;
            z-index: 10;
        }

        .win-tag { color: #ffd700; font-weight: bold; }

        .stats-summary {
            margin-top: 15px;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(10, 8, 15, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
        }

        .winner-checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
            text-align: left;
        }

        .winner-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .dice-rolling {
            font-size: 3rem;
            color: var(--gold-primary);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
            animation: pulse-dice 0.15s infinite alternate;
        }

        @keyframes pulse-dice {
            from { transform: scale(0.95); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="overlay">
    <nav class="navbar">
        <div class="brand">⚔️ MTG Life Counter</div>
        <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    </nav>

    <div class="menu-drawer" id="menuDrawer">
        <div class="menu-header">
            <h3>選單 MENU</h3>
            <button class="hamburger-btn" onclick="toggleMenu()">✕</button>
        </div>
        <button class="menu-item" onclick="navTo('home-view')">🏠 首頁</button>
        <button class="menu-item" onclick="navTo('game-view')">⚔️ 比賽場</button>
        <button class="menu-item" onclick="navTo('records-view')">📜 對戰紀錄</button>
    </div>

    <div id="home-view" class="view active">
        <h1 class="home-title">MAGIC THE GATHERING<br><span style="font-size: 1.3rem; color: #fff;">決戰計血器</span></h1>
        <div id="home-buttons" style="display: flex; flex-direction: column; gap: 15px;">
            <button class="btn-magic" id="btn-continue" style="display:none;" onclick="navTo('game-view')">繼續遊戲</button>
            <button class="btn-magic" onclick="openNewGameModal()">開新局</button>
        </div>
    </div>

    <div id="game-view" class="view">
        <div class="game-grid" id="gameGrid"></div>

        <div class="floating-controls" id="floatingControls" style="display: none;">
            <button class="btn-magic btn-round" onclick="rollD20All()" title="一鍵擲D20">🎲</button>
            <button class="btn-magic btn-round" onclick="openResetModal()" title="重置本局">🔄</button>
        </div>
    </div>

    <div id="records-view" class="view">
        <h2 style="color: var(--gold-primary); margin-bottom: 15px;">對戰歷史紀錄</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn-magic" onclick="exportRecords()">匯出紀錄 (JSON)</button>
            <button class="btn-magic" onclick="document.getElementById('importFile').click()">匯入紀錄</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importRecords(event)">
        </div>

        <div class="records-table-container">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>局數</th>
                        <th>姓名/隊伍</th>
                        <th>戰績</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody"></tbody>
            </table>
        </div>

        <div class="stats-summary">
            <h3 style="color: var(--gold-primary); margin-bottom: 10px;">個人總勝負統計 (勝率高者在前，相同時最早達成者在前)</h3>
            <div id="statsSummaryContent" class="stats-list"></div>
        </div>
    </div>
</div>

<div class="modal-mask" id="newGameModal">
    <div class="modal-content">
        <div class="modal-title">開新局設定</div>
        <div class="form-group">
            <label>模式 (必填)</label>
            <select id="modeSelect" onchange="updateSetupForm()">
                <option value="Commander">指揮官</option>
                <option value="TwoHeadedGiant">雙頭巨人</option>
                <option value="Kingdoms">三國殺</option>
            </select>
        </div>
        <div class="form-group">
            <label>人數 (必填)</label>
            <select id="playerCountSelect" onchange="updatePlayerRows()"></select>
        </div>

        <div style="margin-top: 15px;">
            <label style="color: var(--gold-light);">玩家設定</label>
            <div class="player-setup-list" id="playerSetupList"></div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-magic" id="btnStartGame" style="flex:1;" disabled onclick="startGame()">準備好了！開始對戰</button>
            <button class="btn-magic" style="background: #444;" onclick="closeModal('newGameModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="avatarModal">
    <div class="modal-content">
        <div class="modal-title">選擇鵬洛客頭像</div>
        <div class="avatar-grid" id="avatarGrid"></div>
        <button class="btn-magic" style="margin-top: 15px; width: 100%;" onclick="closeModal('avatarModal')">關閉</button>
    </div>
</div>

<div class="modal-mask" id="resetModal">
    <div class="modal-content" style="text-align: center;">
        <div class="modal-title">重置對戰與勝負結算</div>
        <p style="color: #ccc; font-size:0.9rem;">請勾選本局獲勝的個人或隊伍：</p>
        
        <div class="winner-checkbox-group" id="winnerSelectorList"></div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 20px;">
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('same')">目前模式</button>
            <button class="btn-magic" style="flex:1;" onclick="confirmReset('new')">新模式</button>
        </div>
        <button class="btn-magic" style="width: 100%; background: #444;" onclick="closeModal('resetModal')">取消</button>
    </div>
</div>

<div class="modal-mask" id="diceModal">
    <div class="modal-content" style="text-align: center;">
        <button class="modal-close-x" id="btnDiceClose" onclick="closeModal('diceModal')">✕</button>
        <div class="modal-title" id="diceWinnerTitle">🎲 擲骰進行中...</div>
        <div id="diceResults" style="font-size: 1.05rem; line-height: 1.8; text-align: left; margin-top: 10px; min-height: 120px;"></div>
    </div>
</div>

<script>
    const PLANESWALKERS = [
        { name: "Chandra", url: "https://i.imgur.com/8QzXkQp.jpg" },
        { name: "Liliana 1", url: "https://cards.scryfall.io/art_crop/front/d/1/d12c8c97-6491-452c-811d-943441a7ef9f.jpg" },
        { name: "Liliana 2", url: "https://i.imgur.com/zN4p123.jpg" },
        { name: "Kiora", url: "https://i.imgur.com/v82K39X.jpg" },
        { name: "Jace", url: "https://i.imgur.com/4J9zL1W.jpg" },
        { name: "Gideon", url: "https://i.imgur.com/t3Z8B5K.jpg" },
        { name: "Nissa", url: "https://i.imgur.com/pY93T0R.jpg" },
        { name: "Oko", url: "https://i.imgur.com/R3O20qK.jpg" },
        { name: "Vivien", url: "https://i.imgur.com/W5X9T8L.jpg" },
        { name: "Teferi", url: "https://i.imgur.com/2Y19M3B.jpg" }
    ];

    let state = {
        historyNames: JSON.parse(localStorage.getItem('mtg_historyNames')) || {},
        currentGame: JSON.parse(localStorage.getItem('mtg_currentGame')) || null,
        records: JSON.parse(localStorage.getItem('mtg_records')) || [],
        gameCount: parseInt(localStorage.getItem('mtg_gameCount')) || 1
    };

    let activeSelectingPlayerIndex = null;
    let holdTimer = null;
    let holdInterval = null;

    window.onload = function() {
        if (state.currentGame) {
            document.getElementById('btn-continue').style.display = 'block';
        }
        updateRecordsTable();
    };

    // 翻面切換
    function flipCard(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) {
            cardElem.classList.add('flipped');
        }
    }

    function flipCardFront(index) {
        const cardElem = document.getElementById(`card-${index}`);
        if (cardElem) {
            cardElem.classList.remove('flipped');
        }
    }

    // 長按連發（Hold to repeat）機制
    function startHold(event, actionFn) {
        event.stopPropagation();
        stopHold();
        actionFn();
        holdTimer = setTimeout(() => {
            holdInterval = setInterval(() => {
                actionFn();
            }, 100);
        }, 400);
    }

    function stopHold(event) {
        if (event) event.stopPropagation();
        if (holdTimer) clearTimeout(holdTimer);
        if (holdInterval) clearInterval(holdInterval);
        holdTimer = null;
        holdInterval = null;
    }

    function getHoldEvents(actionFnStr) {
        return `
            onmousedown="startHold(event, () => ${actionFnStr})" 
            onmouseup="stopHold(event)" 
            onmouseleave="stopHold(event)"
            ontouchstart="startHold(event, () => ${actionFnStr})" 
            ontouchend="stopHold(event)" 
            ontouchcancel="stopHold(event)"
        `;
    }

    function toggleMenu() {
        document.getElementById('menuDrawer').classList.toggle('active');
    }

    function navTo(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('menuDrawer').classList.remove('active');
        
        if (viewId === 'game-view') {
            renderGameGrid();
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function openNewGameModal() {
        document.getElementById('newGameModal').classList.add('active');
        updateSetupForm();
    }

    function updateSetupForm() {
        const mode = document.getElementById('modeSelect').value;
        const countSelect = document.getElementById('playerCountSelect');
        const currentCount = countSelect.value;
        countSelect.innerHTML = '';

        if (mode === 'TwoHeadedGiant') {
            [4, 6, 8].forEach(n => countSelect.add(new Option(`${n} 人 (${n/2} 隊)`, n)));
        } else {
            for(let i=2; i<=8; i++) countSelect.add(new Option(`${i} 人`, i));
        }

        if (Array.from(countSelect.options).some(opt => opt.value === currentCount)) {
            countSelect.value = currentCount;
        }

        updatePlayerRows();
    }

    function updatePlayerRows() {
        const mode = document.getElementById('modeSelect').value;
        const count = parseInt(document.getElementById('playerCountSelect').value);
        const container = document.getElementById('playerSetupList');

        const oldInputs = Array.from(container.querySelectorAll('.p-name')).map(i => i.value);
        const oldAvatars = Array.from(container.querySelectorAll('.avatar-preview')).map(img => img.src);

        container.innerHTML = '';
        let rowCount = mode === 'TwoHeadedGiant' ? count / 2 : count;

        for (let i = 0; i < rowCount; i++) {
            const row = document.createElement('div');
            row.className = 'player-setup-row';
            let defaultAvatar = oldAvatars[i] || PLANESWALKERS[i % PLANESWALKERS.length].url;

            if (mode === 'TwoHeadedGiant') {
                let name1 = oldInputs[i * 2] || '';
                let name2 = oldInputs[i * 2 + 1] || '';
                row.innerHTML = `
                    <span class="team-label">隊 ${i+1}:</span>
                    <input type="text" placeholder="隊友 1" class="p-name" value="${name1}" oninput="validateSetupForm()">
                    <input type="text" placeholder="隊友 2" class="p-name" value="${name2}" oninput="validateSetupForm()">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            } else {
                let name = oldInputs[i] || '';
                row.innerHTML = `
                    <input type="text" placeholder="玩家 ${i+1} 姓名" class="p-name" value="${name}" oninput="validateSetupForm()" onchange="autoFillAvatar(this, ${i})">
                    <img src="${defaultAvatar}" class="avatar-preview" id="avatar-prev-${i}" referrerpolicy="no-referrer" onclick="openAvatarModal(${i})">
                `;
            }
            container.appendChild(row);
        }

        validateSetupForm();
    }

    function autoFillAvatar(inputElem, index) {
        const val = inputElem.value.trim();
        if (state.historyNames[val]) {
            document.getElementById(`avatar-prev-${index}`).src = state.historyNames[val];
        }
    }

    function validateSetupForm() {
        const inputs = Array.from(document.querySelectorAll('.p-name'));
        const allFilled = inputs.every(input => input.value.trim() !== '');
        document.getElementById('btnStartGame').disabled = !allFilled;
    }

    function openAvatarModal(playerIndex) {
        activeSelectingPlayerIndex = playerIndex;
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = PLANESWALKERS.map(p => `
            <img src="${p.url}" title="${p.name}" class="avatar-option" referrerpolicy="no-referrer" onclick="selectAvatar('${p.url}')">
        `).join('');
        document.getElementById('avatarModal').classList.add('active');
    }

    function selectAvatar(url) {
        const img = document.getElementById(`avatar-prev-${activeSelectingPlayerIndex}`);
        if(img) img.src = url;
        closeModal('avatarModal');
    }

    function startGame() {
        const mode = document.getElementById('modeSelect').value;
        const rows = document.querySelectorAll('.player-setup-row');
        let players = [];
        let defaultLife = mode === 'TwoHeadedGiant' ? 50 : 40;

        rows.forEach((row, idx) => {
            if (mode === 'TwoHeadedGiant') {
                const names = Array.from(row.querySelectorAll('.p-name')).map(i => i.value.trim());
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: `${names[0]} & ${names[1]}`,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamage: 0,
                    isMonarch: false
                });
            } else {
                const name = row.querySelector('.p-name').value.trim();
                const avatar = row.querySelector('.avatar-preview').src;
                players.push({
                    id: idx,
                    name: name,
                    avatar: avatar,
                    life: defaultLife,
                    poison: 0,
                    cmdDamage: 0,
                    isMonarch: false
                });
                state.historyNames[name] = avatar;
            }
        });

        localStorage.setItem('mtg_historyNames', JSON.stringify(state.historyNames));
        state.currentGame = { mode: mode, players: players };

        saveCurrentGame();
        closeModal('newGameModal');
        navTo('game-view');
    }

    function saveCurrentGame() {
        localStorage.setItem('mtg_currentGame', JSON.stringify(state.currentGame));
        document.getElementById('btn-continue').style.display = 'block';
    }

    function renderGameGrid() {
        const grid = document.getElementById('gameGrid');
        const controls = document.getElementById('floatingControls');
        grid.innerHTML = '';

        // 判斷若無遊戲資料或玩家陣列為空，隱藏浮動按鈕並返回
        if (!state.currentGame || !state.currentGame.players || state.currentGame.players.length === 0) {
            if (controls) controls.style.display = 'none';
            return;
        }

        // 有資料時顯示控制按鈕
        if (controls) controls.style.display = 'flex';

        const count = state.currentGame.players.length;
        const isLayoutLarge = (count >= 2 && count <= 3);

        if (isLayoutLarge) {
            grid.classList.add('layout-large');
        } else {
            grid.classList.remove('layout-large');
        }

        const flippedIndices = new Set();
        document.querySelectorAll('.player-card.flipped').forEach(card => {
            const idx = card.id.replace('card-', '');
            flippedIndices.add(parseInt(idx));
        });

        state.currentGame.players.forEach((p, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'player-card-wrapper';

            const isDead = (p.life <= 0) || (p.poison >= 10) || (p.cmdDamage >= 10);
            const isFlipped = flippedIndices.has(index);

            cardWrapper.innerHTML = `
                <div class="player-card ${isDead ? 'dead' : ''} ${isFlipped ? 'flipped' : ''}" id="card-${index}">
                    <div class="card-front" onclick="flipCard(${index})">
                        <div class="card-header">
                            <div class="player-info">
                                <img src="${p.avatar}" class="card-avatar" referrerpolicy="no-referrer">
                                <div class="card-name">${p.name}</div>
                            </div>
                            ${state.currentGame.mode === 'Kingdoms' ? 
                                `<div class="monarch-crown ${p.isMonarch ? 'active' : ''}" onclick="event.stopPropagation(); toggleMonarch(${index})" title="指定主公">👑</div>` : ''}
                        </div>
                        <div class="life-display ${p.life > 0 && p.life <= 10 ? 'danger' : ''}">${p.life}</div>
                        <div class="status-badges">
                            ${p.poison > 0 ? `<span class="badge ${p.poison >= 8 && p.poison <= 9 ? 'warning-glow' : ''}">🤢 毒:${p.poison}</span>` : ''}
                            ${p.cmdDamage > 0 ? `<span class="badge ${p.cmdDamage >= 8 && p.cmdDamage <= 9 ? 'warning-glow' : ''}">⚔️ 傷:${p.cmdDamage}</span>` : ''}
                        </div>
                        <div class="life-controls" onclick="event.stopPropagation()">
                            <button class="btn-life btn-life-large" ${getHoldEvents(`changeLife(${index}, -1)`)}>-1</button>
                            <button class="btn-life btn-life-large" ${getHoldEvents(`changeLife(${index}, 1)`)}>+1</button>
                        </div>
                    </div>

                    <div class="card-back" onclick="flipCardFront(${index})">
                        <div class="card-back-body">
                            <div class="card-back-item">
                                <label style="font-size:0.85rem; margin-bottom: 8px; font-weight:bold; color:var(--gold-light);">🤢 中毒標記</label>
                                <div class="life-controls" onclick="event.stopPropagation()">
                                    <button class="btn-life btn-status-large" ${getHoldEvents(`changeStatus(${index}, 'poison', -1)`)}>-1</button>
                                    <button class="btn-life btn-status-large" ${getHoldEvents(`changeStatus(${index}, 'poison', 1)`)}>+1</button>
                                </div>
                            </div>
                            <div class="card-back-item">
                                <label style="font-size:0.85rem; margin-bottom: 8px; font-weight:bold; color:var(--gold-light);">⚔️ 指揮官傷害</label>
                                <div class="life-controls" onclick="event.stopPropagation()">
                                    <button class="btn-life btn-status-large" ${getHoldEvents(`changeStatus(${index}, 'cmdDamage', -1)`)}>-1</button>
                                    <button class="btn-life btn-status-large" ${getHoldEvents(`changeStatus(${index}, 'cmdDamage', 1)`)}>+1</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(cardWrapper);
        });
    }

    function changeLife(index, delta) {
        let p = state.currentGame.players[index];
        p.life = Math.max(0, p.life + delta);
        saveCurrentGame();
        renderGameGrid();
    }

    function changeStatus(index, type, delta) {
        let p = state.currentGame.players[index];
        p[type] = Math.max(0, p[type] + delta);
        saveCurrentGame();
        renderGameGrid();
    }

    function toggleMonarch(index) {
        state.currentGame.players.forEach((p, i) => {
            if (i === index) {
                p.isMonarch = !p.isMonarch;
                p.life = p.isMonarch ? 50 : 40;
            } else {
                p.isMonarch = false;
            }
        });
        saveCurrentGame();
        renderGameGrid();
    }

    function rollD20All() {
        const results = document.getElementById('diceResults');
        const titleElem = document.getElementById('diceWinnerTitle');
        const closeBtn = document.getElementById('btnDiceClose');

        titleElem.innerHTML = `🎲 擲骰進行中...`;
        closeBtn.style.display = 'none';
        document.getElementById('diceModal').classList.add('active');

        let contenders = state.currentGame.players.map(p => ({ name: p.name }));
        let roundLogs = [];
        let round = 1;
        let finalWinner = "";

        while (contenders.length > 1) {
            let log = { round: round, rolls: [], isTie: false };
            let maxRoll = -1;
            let currentWinners = [];

            contenders.forEach(c => {
                const roll = Math.floor(Math.random() * 20) + 1;
                log.rolls.push({ name: c.name, roll: roll });
                if (roll > maxRoll) {
                    maxRoll = roll;
                    currentWinners = [{ name: c.name, roll: roll }];
                } else if (roll === maxRoll) {
                    currentWinners.push({ name: c.name, roll: roll });
                }
            });

            if (currentWinners.length === 1) {
                finalWinner = currentWinners[0].name;
                roundLogs.push(log);
                break;
            } else {
                log.isTie = true;
                roundLogs.push(log);
                contenders = currentWinners;
                round++;
            }
        }

        let startTime = Date.now();
        let animInterval = setInterval(() => {
            let elapsedTime = Date.now() - startTime;
            // 動畫縮短為 2 秒 (2000ms)
            if (elapsedTime < 2000) {
                let randomRolls = state.currentGame.players.map(p => 
                    `<div><strong>${p.name}</strong> 🎲 <span class="dice-rolling">${Math.floor(Math.random() * 20) + 1}</span></div>`
                ).join('');
                results.innerHTML = `<div style="text-align:center;">${randomRolls}</div>`;
            } else {
                clearInterval(animInterval);
                titleElem.innerHTML = `🎲 最終勝者：<span style="color:#ffd700">${finalWinner}</span>！`;
                closeBtn.style.display = 'block';

                let finalHtml = '';
                roundLogs.forEach(log => {
                    if (log.round > 1) {
                        finalHtml += `<div style="color:var(--gold-primary); margin-top:8px; font-weight:bold; border-top:1px dashed #444; padding-top:4px;">⚠️ 出現最高平手！進行第 ${log.round} 輪同分重擲：</div>`;
                    }
                    log.rolls.forEach(r => {
                        finalHtml += `<div><strong>${r.name}</strong> 擲出 🎲 <span style="color:var(--gold-primary); font-size:1.2rem; font-weight:bold;">${r.roll}</span> 點</div>`;
                    });
                });
                results.innerHTML = finalHtml;
            }
        }, 80);
    }

    function openResetModal() {
        if (!state.currentGame) return;
        const list = document.getElementById('winnerSelectorList');
        list.innerHTML = '';

        state.currentGame.players.forEach((p, idx) => {
            list.innerHTML += `
                <label class="winner-checkbox-item">
                    <input type="checkbox" class="winner-checkbox" value="${idx}">
                    <span>👑 ${p.name} (剩餘血量: ${p.life})</span>
                </label>
            `;
        });

        document.getElementById('resetModal').classList.add('active');
    }

    function confirmReset(type) {
        const checkboxes = document.querySelectorAll('.winner-checkbox');
        let winnersIndices = [];
        checkboxes.forEach(cb => {
            if (cb.checked) winnersIndices.push(parseInt(cb.value));
        });

        recordGameResult(winnersIndices);
        closeModal('resetModal');

        if (type === 'same') {
            let defaultLife = state.currentGame.mode === 'TwoHeadedGiant' ? 50 : 40;
            state.currentGame.players.forEach(p => {
                p.life = p.isMonarch ? 50 : defaultLife;
                p.poison = 0;
                p.cmdDamage = 0;
            });
            saveCurrentGame();
            renderGameGrid();
        } else {
            openNewGameModal();
        }
    }

    function recordGameResult(winnersIndices) {
        if (!state.currentGame) return;

        let dateStr = new Date().toLocaleDateString();

        state.currentGame.players.forEach((p, idx) => {
            let isWin = winnersIndices.includes(idx);
            state.records.push({
                date: dateStr,
                gameIndex: state.gameCount,
                name: p.name,
                result: isWin ? 'WIN' : 'LOSE'
            });
        });

        state.gameCount++;
        localStorage.setItem('mtg_records', JSON.stringify(state.records));
        localStorage.setItem('mtg_gameCount', state.gameCount);
        updateRecordsTable();
    }

    function updateRecordsTable() {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        state.records.slice().reverse().forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.date}</td>
                    <td>第 ${r.gameIndex} 局</td>
                    <td>${r.name}</td>
                    <td>${r.result === 'WIN' ? '<span class="win-tag">👑 贏</span>' : '輸'}</td>
                </tr>
            `;
        });

        const statsMap = {};
        state.records.forEach((r, recordIndex) => {
            const individualNames = r.name.split('&').map(s => s.trim());
            individualNames.forEach(name => {
                if (!statsMap[name]) {
                    statsMap[name] = { 
                        name: name, 
                        win: 0, 
                        lose: 0, 
                        firstReachedIndex: recordIndex
                    };
                }
                if (r.result === 'WIN') statsMap[name].win++;
                else statsMap[name].lose++;
            });
        });

        const statsArray = Object.values(statsMap).map(s => {
            const total = s.win + s.lose;
            const rate = total > 0 ? (s.win / total) : 0;
            return { ...s, total, rate };
        });

        statsArray.sort((a, b) => {
            if (b.rate !== a.rate) {
                return b.rate - a.rate;
            }
            return a.firstReachedIndex - b.firstReachedIndex;
        });

        const summaryElem = document.getElementById('statsSummaryContent');
        if (statsArray.length === 0) {
            summaryElem.innerHTML = `<div style="color:#aaa;">尚無統計數據</div>`;
        } else {
            summaryElem.innerHTML = statsArray.map(s => `
                <div class="stats-item">
                    <span><strong>${s.name}</strong></span>
                    <span>${s.win}勝 / ${s.lose}敗 <span style="color:var(--gold-primary); margin-left:8px;">(勝率: ${Math.round(s.rate * 100)}%)</span></span>
                </div>
            `).join('');
        }
    }

    function exportRecords() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.records, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mtg_records_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
    }

    function importRecords(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    state.records = importedData;
                    localStorage.setItem('mtg_records', JSON.stringify(state.records));
                    updateRecordsTable();
                    alert("對戰紀錄匯入成功！");
                }
            } catch (err) {
                alert("檔案格式錯誤，匯入失敗。");
            }
        };
        fileReader.readAsText(event.target.files[0]);
    }
</script>
</body>
